  /api/cards/{id}/verify-link:
    post:
      tags:
      - cards
      summary: 카드 뉴스 출처 링크 재검증 (FR-027)
      description: |
        카드 뉴스에 포함된 출처 링크의 유효성을 재검증합니다.
        깨진 링크는 archive_url로 폴백할 수 있습니다.
      operationId: verifyCardLinks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: CN-20260502-001
      responses:
        '200':
          description: 검증 결과
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        source_links:
                          type: array
                          items:
                            type: object
                            properties:
                              url:
                                type: string
                              status:
                                type: string
                                enum:
                                - ok
                                - broken
                                - archived
                              archive_url:
                                type: string
                                nullable: true
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '503':
          $ref: "#/components/responses/ServiceUnavailable"
        '504':
          $ref: "#/components/responses/GatewayTimeout"
        '500':
          $ref: "#/components/responses/InternalServerError"
