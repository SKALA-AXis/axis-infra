openapi: 3.0.3
info:
  title: AXIS REST API
  description: |
    # SpringBoot ↔ Frontend REST API 계약서 (v3.0)

    ## 문서 개요

    | 항목      | 내용                                               |
    | --------- | -------------------------------------------------- |
    | 기준 문서 | 요구사항정의서 v0.1                                |
    | 기준일    | 2026-04-20                                         |
    | FR 범위   | FR-001 ~ FR-043                                    |
    | 총 FR 수  | 43개                                               |
    | API 대상  | Frontend → SpringBoot 호출 REST API               |
    | 내부 연계 | 내부 AI 파이프라인은 `ai-internal-api.yaml` 참조 |
     ---
    본 문서는 SpringBoot 백엔드와 Frontend 간 REST API 계약을 정의합니다.
    모든 정상 응답은 공통 래퍼 구조인 `{ success, data, timestamp }` 형식을 사용합니다.

 

    ## 1. 공통 응답 규칙
    ### 1.1 정상 응답 구조
    모든 정상 응답은 `success: true` 값을 가지며, 실제 응답 데이터는 `data` 필드에 포함합니다.
    ```json
    {
      "success": true,
      "data": {},
      "timestamp": "2026-04-20T09:00:00Z"
    }
    ```

    | 필드          | 타입                  | 설명                          |
    | ------------- | --------------------- | ----------------------------- |
    | `success`   | boolean               | 요청 성공 여부                |
    | `data`      | object / array / null | 실제 응답 데이터              |
    | `timestamp` | string                | 응답 생성 시각, ISO 8601 형식 |

    ### 1.2 에러 응답 구조

    모든 에러 응답은 `success: false` 값을 가지며, 에러 상세 정보는 `error` 필드에 포함합니다.

    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "사람이 읽을 수 있는 설명",
        "detail": "개발·운영 로그 확인용 상세 설명",
        "field_errors": [
          {
            "field": "email",
            "reason": "올바른 이메일 형식이어야 합니다.",
            "rejected_value": "invalid-email"
          }
        ],
        "trace_id": "req_01HYAXIS0001"
      },
      "timestamp": "2026-04-20T09:00:00Z"
    }
    ```

    | 필드                                    |    타입 | 필수 여부 | 설명                                         |
    | --------------------------------------- | ------: | --------: | -------------------------------------------- |
    | `success`                             | boolean |      필수 | 항상 `false`                               |
    | `error.code`                          |  string |      필수 | 서비스 공통 에러 코드                        |
    | `error.message`                       |  string |      필수 | 사용자 또는 클라이언트가 이해할 수 있는 설명 |
    | `error.detail`                        |  string |      선택 | 개발·운영 로그 확인용 상세 설명             |
    | `error.field_errors`                  |   array |      선택 | 필드 단위 검증 실패 상세 목록                |
    | `error.field_errors[].field`          |  string |      필수 | 오류가 발생한 필드명                         |
    | `error.field_errors[].reason`         |  string |      필수 | 검증 실패 사유                               |
    | `error.field_errors[].rejected_value` |     any |      선택 | 거절된 입력값                                |
    | `error.trace_id`                      |  string |      선택 | 요청 추적 ID                                 |
    | `timestamp`                           |  string |      필수 | 응답 생성 시각, ISO 8601 형식                |

    ---

    ## 2. 인증 정책

    JWT Access Token을 `Authorization` 헤더에 Bearer 토큰 형식으로 포함합니다.

    ```http
    Authorization: Bearer {token}
    ```

    ### 2.1 인증 필요 API

    별도 명시가 없는 모든 `/api/**` 엔드포인트는 인증이 필요합니다.

    ### 2.2 인증 불필요 API

    다음 엔드포인트는 인증 없이 호출할 수 있습니다.

    | Method   | Path                  | 설명                |
    | -------- | --------------------- | ------------------- |
    | `GET`  | `/health`           | 서비스 헬스 체크    |
    | `POST` | `/api/auth/login`   | 로그인              |
    | `POST` | `/api/auth/signup`  | 회원가입            |
    | `POST` | `/api/auth/refresh` | Access Token 재발급 |

    ---

    ## 3. FR 노출 범위

    ### 3.1 외부 API에 노출되는 FR

    Frontend에서 SpringBoot로 직접 호출하는 외부 REST API 범위입니다.

    | 도메인       | FR ID                                                  | 설명                                  |
    | ------------ | ------------------------------------------------------ | ------------------------------------- |
    | 인증         | FR-001, FR-002                                         | 로그인, 회원가입 등 사용자 인증       |
    | 카드 뉴스    | FR-026, FR-027, FR-028                                 | 카드 뉴스 목록, 상세, 표시 메타데이터 |
    | 북마크·공유 | FR-029, FR-030                                         | 북마크 등록·해제, 공유               |
    | 모니터링     | FR-018, FR-019, FR-021, FR-031, FR-032, FR-033, FR-034 | 모니터링 개요, 트렌드, 이슈, 대시보드 |
    | 브리핑       | FR-022, FR-035                                         | 브리핑 생성, 생성 상태 조회           |
    | 알림         | FR-024, FR-025                                         | 알림 목록, 읽음 처리                  |
    | 믹서기       | FR-038, FR-039                                         | 사용자 조합형 콘텐츠 생성·조회       |
    | 설정         | FR-040, FR-041, FR-042, FR-043                         | 사용자 설정 조회·수정                |

    ### 3.2 외부 API에 노출되지 않는 FR

    아래 기능은 내부 AI 파이프라인 전용이며, 외부 Frontend API로 직접 노출하지 않습니다.
    상세 계약은 `ai-internal-api.yaml`을 기준으로 관리합니다.

    | 도메인      | FR ID           | 설명                            |
    | ----------- | --------------- | ------------------------------- |
    | 크롤링      | FR-003 ~ FR-010 | 데이터 수집 및 원천 콘텐츠 확보 |
    | 분류·분석  | FR-011 ~ FR-017 | 콘텐츠 분류, 분석, 스코어링     |
    | 시사점 생성 | FR-020, FR-023  | AI 기반 인사이트 및 시사점 생성 |

    ---

    ## 4. 주요 도메인 경로 정리

    | 도메인    | Base Path              | 비고                        |
    | --------- | ---------------------- | --------------------------- |
    | 헬스 체크 | `/health`            | 인증 불필요                 |
    | 인증      | `/api/auth`          | 일부 엔드포인트 인증 불필요 |
    | 카드 뉴스 | `/api/cards`         | 카드 뉴스 API 대표 경로     |
    | 북마크    | `/api/bookmarks`     | 사용자별 북마크 관리        |
    | 공유      | `/api/shares`        | 콘텐츠 공유 기능            |
    | 모니터링  | `/api/monitoring`    | 대시보드·트렌드·이슈 조회 |
    | 브리핑    | `/api/briefings`     | 브리핑 생성 및 상태 조회    |
    | 알림      | `/api/notifications` | 알림 조회 및 읽음 처리      |
    | 믹서기    | `/api/mixer`         | 사용자 조합형 콘텐츠 기능   |
    | 설정      | `/api/settings`      | 사용자 설정 관리            |

    ---

    ## 5. 공통 에러 코드 정의

    | Code                             | HTTP Status | 설명                                |
    | -------------------------------- | ----------: | ----------------------------------- |
    | `COMMON_BAD_REQUEST`           |         400 | 잘못된 요청 형식 또는 파라미터 오류 |
    | `COMMON_VALIDATION_ERROR`      |         422 | 요청 데이터 검증 실패               |
    | `AUTH_TOKEN_EXPIRED`           |         401 | Access Token 만료                   |
    | `AUTH_FORBIDDEN`               |         403 | 접근 권한 없음                      |
    | `COMMON_NOT_FOUND`             |         404 | 요청한 리소스를 찾을 수 없음        |
    | `COMMON_CONFLICT`              |         409 | 리소스 상태 충돌 또는 중복 데이터   |
    | `AUTH_ACCOUNT_LOCKED`          |         423 | 계정 또는 리소스 잠김               |
    | `COMMON_RATE_LIMIT_EXCEEDED`   |         429 | 요청 한도 초과                      |
    | `COMMON_INTERNAL_SERVER_ERROR` |         500 | 서버 내부 오류                      |
    | `EXTERNAL_SERVICE_UNAVAILABLE` |         503 | 외부 또는 AI 서비스 일시 사용 불가  |
    | `EXTERNAL_GATEWAY_TIMEOUT`     |         504 | 외부 또는 AI 서비스 처리 시간 초과  |

    ---

    ## 6. 에러 컴포넌트 매핑

    | 컴포넌트                | Error Code                       | HTTP Status |
    | ----------------------- | -------------------------------- | ----------: |
    | `BadRequest`          | `COMMON_BAD_REQUEST`           |         400 |
    | `ValidationError`     | `COMMON_VALIDATION_ERROR`      |         422 |
    | `Unauthorized`        | `AUTH_TOKEN_EXPIRED`           |         401 |
    | `Forbidden`           | `AUTH_FORBIDDEN`               |         403 |
    | `NotFound`            | `COMMON_NOT_FOUND`             |         404 |
    | `Conflict`            | `COMMON_CONFLICT`              |         409 |
    | `RateLimitExceeded`   | `COMMON_RATE_LIMIT_EXCEEDED`   |         429 |
    | `InternalServerError` | `COMMON_INTERNAL_SERVER_ERROR` |         500 |
    | `ServiceUnavailable`  | `EXTERNAL_SERVICE_UNAVAILABLE` |         503 |
    | `GatewayTimeout`      | `EXTERNAL_GATEWAY_TIMEOUT`     |         504 |

    ---

    ## 7. 관리 주의사항, 원칙

    - 외부 API는 Frontend가 직접 호출하는 기능만 포함합니다.
    - AI 크롤링, 분류, 분석, 시사점 생성 등 내부 파이프라인 기능은 외부 API 계약에서 분리합니다.
    - 모든 응답은 성공·실패 여부와 관계없이 `timestamp`를 포함합니다.
    - 모든 에러는 공통 에러 응답 구조와 공통 에러 코드를 따릅니다.
    - 인증이 필요한 API는 JWT Bearer Token을 기준으로 보호합니다.
    - 경로와 응답 스키마는 도메인별 일관성을 우선합니다.

    
  version: 3.0.0
  contact:
    name: SKALA AI 13조
servers:
- url: http://localhost:8080
  description: Local development
- url: http://api.axis.internal
  description: Production
tags:
- name: auth
  description: 인증 — FR-001, FR-002
- name: cards
  description: 카드 뉴스 — FR-026, FR-027, FR-028
- name: dashboard
  description: 홈 대시보드 — 프론트 `home` view 전용 요약·차트·최근 기사 데이터
- name: peers
  description: Peer+ — Peer사 요약, IR 수치, 키워드 클라우드, 관련 카드뉴스
- name: insights
  description: 인사이트 — 카드뉴스 근거 기반 판단 결과
- name: keyword-graph
  description: 키워드 그래프 — 관계 그래프, 노드 상세, 관련 카드뉴스
- name: monitoring
  description: 모니터링 — Peer사 관찰, 기간별 동향, 카드 뉴스 검색, 대시보드 요약, 재무·전략 분석 — FR-018, FR-019, FR-021, FR-031, FR-032, FR-033, FR-034
- name: briefings
  description: 브리핑 — 카드 뉴스 기반 일간·장기 동향 분석 리포트 — FR-022, FR-035
- name: alerts
  description: 알림 — FR-024, FR-025
- name: notifications
  description: 전역 알림 드롭다운 — TopNav in-app notification
- name: bookmarks
  description: 북마크·공유 — FR-029, FR-030
- name: mixer
  description: 믹서기 — FR-038, FR-039
- name: raw-articles
  description: 원문 아카이브 — PostgreSQL raw_articles 조회
- name: assistant
  description: 플로팅 AI 채팅 — 검색, 보고서 초안 응답
- name: settings
  description: 사용자 설정 — FR-040, FR-041, FR-042, FR-043
- name: admin
  description: 관리자 콘솔
- name: pipeline
  description: 파이프라인 (관리자 전용)
- name: system
  description: 시스템
- name: deprecated
  description: 프론트 목업 기준 직접 사용하지 않는 호환·레거시 후보
security:
- BearerAuth: []
paths:
  # ════════════════════════════════════════════════════════
  # 시스템
  # ════════════════════════════════════════════════════════
  /health:
    get:
      tags:
      - system
      summary: 헬스체크
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '503':
          $ref: "#/components/responses/ServiceUnavailable"
  # ════════════════════════════════════════════════════════
  # 인증
  # ════════════════════════════════════════════════════════
  /api/auth/signup:
    post:
      tags:
      - auth
      summary: 회원가입 (FR-001)
      description: 이메일·부서·역할 입력하여 계정 생성. 이메일 인증 후 활성화.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - name
              - department
              - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
                department:
                  type: string
                  example: 사업전략팀
                role:
                  type: string
                  enum:
                  - strategist
                  - manager
                  - admin
      responses:
        '201':
          description: 회원가입 성공 (인증 메일 발송)
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/UserProfile"
        '400':
          $ref: "#/components/responses/BadRequest"
        '422':
          $ref: "#/components/responses/ValidationError"
        '409':
          $ref: "#/components/responses/Conflict"
        '429':
          $ref: "#/components/responses/RateLimitExceeded"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /api/auth/verify-email:
    post:
      tags:
      - auth
      summary: 이메일 인증 (FR-001)
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '422':
          $ref: "#/components/responses/ValidationError"
        '409':
          $ref: "#/components/responses/Conflict"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /api/auth/login:
    post:
      tags:
      - auth
      summary: 로그인 (FR-002)
      description: JWT access token + refresh token 발급
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - access_token
                      - refresh_token
                      - user
                      properties:
                        access_token:
                          type: string
                        refresh_token:
                          type: string
                        user:
                          $ref: "#/components/schemas/UserProfile"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '423':
          $ref: "#/components/responses/Locked"
        '429':
          $ref: "#/components/responses/RateLimitExceeded"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: 로그아웃
      operationId: logout
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /api/auth/refresh:
    post:
      tags:
      - auth
      summary: Access Token 갱신
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: 갱신 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        access_token:
                          type: string
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '422':
          $ref: "#/components/responses/ValidationError"
        '500':
          $ref: "#/components/responses/InternalServerError"
  /api/auth/me:
    get:
      tags:
      - auth
      summary: 내 정보 조회
      operationId: getMe
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/UserProfile"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '500':
          $ref: "#/components/responses/InternalServerError"
  # ════════════════════════════════════════════════════════
  # 홈 대시보드 / 전역 검색 / Peer+
  # - 프론트 App.tsx activeView 기준: home, peerPlus, global TopNav
  # - 기존 root compatibility(`/dashboard`, `/peers`)는 Deprecated Candidate
  # ════════════════════════════════════════════════════════
  /api/dashboard/summary:
    get:
      tags:
      - dashboard
      summary: 홈 대시보드 요약
      description: |
        프론트 `HomeDashboardView`가 필요로 하는 홈 화면 데이터입니다.
        기존 `/dashboard` root compatibility endpoint를 정규 `/api/**` 경로로 승격합니다.
      operationId: getDashboardSummary
      parameters:
      - name: date
        in: query
        description: 기준일. 생략 시 서버 기준 오늘(KST)
        schema:
          type: string
          format: date
      - name: peer_id
        in: query
        schema:
          $ref: "#/components/schemas/PeerIdEnum"
      responses:
        '200':
          description: 홈 대시보드 데이터
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
