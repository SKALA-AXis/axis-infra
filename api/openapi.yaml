  # FR-022 브리핑 / FR-035 카드 뉴스 기반 브리핑 표시
  # - 브리핑은 카드 뉴스 원문이 아니라 카드 뉴스 묶음 기반 분석 리포트
  # - 데일리/주간/월간/분기/커스텀 기간 브리핑 지원
  # - 카드 뉴스 검색은 브리핑 화면 내부 기능으로 제공
  # ════════════════════════════════════════════════════════
  /api/briefings/summary:
    get:
      tags:
      - briefings
      summary: 브리핑 화면용 요약
      description: |
        `BriefingsView`가 날짜/월/주차 선택 후 즉시 표시하는 브리핑 본문, 신호 카드, 근거 카드뉴스 큐를 반환합니다.
        기존 `/api/briefings/today`는 일간 고정이어서 주간/월간 목업 플로우를 충족하지 못합니다.
      operationId: getBriefingSummary
      parameters:
      - name: briefing_type
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/BriefingTypeEnum"
      - name: date
        in: query
        description: 일간 브리핑 기준일
        schema:
          type: string
          format: date
      - name: month
        in: query
        description: 주간/월간 브리핑 기준 월(`YYYY-MM`)
        schema:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
          example: 2026-05
      - name: week_index
        in: query
        description: 주간 브리핑 주차(1~5)
        schema:
          type: integer
          minimum: 1
          maximum: 5
      - name: peer_id
        in: query
        schema:
          $ref: "#/components/schemas/PeerIdEnum"
      - name: include_cards
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: 브리핑 화면 요약
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/BriefingWorkspace"
              examples:
                success:
                  value:
                    success: true
                    data:
                      id: BR-20260511-D
                      briefing_type: daily
                      title: 2026.05.11 일간 브리핑
                      window: 2026.05.11 감지 카드뉴스 기반
                      briefingLead: 오늘 감지된 카드뉴스 4건을 종합하면 AI 인프라와 수주 신호가 함께 움직입니다.
                      signalCards:
                      - label: 시장 신호
                        value: AX·수주·인프라 키워드가 같은 흐름으로 반복됩니다.
                        metric: 4건 종합
                      whatHappenedDigest:
                      - AX가 PoC 검증을 넘어 실제 운영과 수주로 이동하고 있습니다.
                      meaning:
                      - 운영 지표로 증명되는 AX 전환이 중요해졌습니다.
                      response:
                      - SK AX 제안서는 고객 KPI와 안정성을 먼저 보여줘야 합니다.
                      benchmark:
                      - 삼성SDS 공개 레퍼런스 표현 방식
                      ideas:
                      - 고객별 오늘의 AX 변화 3줄 브리핑 자동 생성
                      selectedCards:
                      - CN-20260511-001
                      reportText: "[AXIS 일간 브리핑] 2026.05.11 일간 브리핑"
                    timestamp: '2026-05-11T00:00:00Z'
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
