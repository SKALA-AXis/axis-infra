# ════════════════════════════════════════════════════════
# 컴포넌트
# ════════════════════════════════════════════════════════
components:
  # 인증 스키마
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  # 공통 에러 응답 컴포넌트
  responses:
    BadRequest:
      description: 잘못된 요청 형식 또는 파라미터 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidQuery:
              summary: 잘못된 쿼리 파라미터
              value:
                success: false
                error:
                  code: COMMON_BAD_REQUEST
                  message: 요청 형식이 올바르지 않습니다.
                  trace_id: req_01HYAXIS0001
                timestamp: '2026-04-20T09:00:00Z'
    ValidationError:
      description: 요청 데이터 검증 실패
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationFailed:
              summary: 필수값 또는 형식 검증 실패
              value:
                success: false
                error:
                  code: COMMON_VALIDATION_ERROR
                  message: 요청 데이터 검증에 실패했습니다.
                  field_errors:
                  - field: email
                    reason: 올바른 이메일 형식이어야 합니다.
                  trace_id: req_01HYAXIS0002
                timestamp: '2026-04-20T09:00:00Z'
    Unauthorized:
      description: 인증 실패 또는 토큰 만료
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            tokenExpired:
              summary: Access Token 만료
              value:
                success: false
                error:
                  code: AUTH_TOKEN_EXPIRED
                  message: Access token이 만료되었습니다. 토큰을 갱신해 주세요.
                  trace_id: req_01HYAXIS0003
                timestamp: '2026-04-20T09:00:00Z'
    Forbidden:
      description: 접근 권한 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              summary: 권한 부족
              value:
                success: false
                error:
                  code: AUTH_FORBIDDEN
                  message: 해당 리소스에 접근할 권한이 없습니다.
                  trace_id: req_01HYAXIS0004
                timestamp: '2026-04-20T09:00:00Z'
    NotFound:
      description: 요청한 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              summary: 리소스 없음
              value:
                success: false
                error:
                  code: COMMON_NOT_FOUND
                  message: 요청한 리소스를 찾을 수 없습니다.
                  trace_id: req_01HYAXIS0005
                timestamp: '2026-04-20T09:00:00Z'
    Conflict:
      description: 리소스 상태 충돌 또는 중복 데이터
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            duplicated:
              summary: 중복 리소스
              value:
                success: false
                error:
                  code: COMMON_CONFLICT
                  message: 이미 존재하거나 현재 상태에서 처리할 수 없는 요청입니다.
                  trace_id: req_01HYAXIS0006
                timestamp: '2026-04-20T09:00:00Z'
    Locked:
      description: 계정 또는 리소스 잠김
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            accountLocked:
              summary: 로그인 실패 누적으로 계정 잠김
              value:
                success: false
                error:
                  code: AUTH_ACCOUNT_LOCKED
                  message: 로그인 실패 횟수 초과로 계정이 일시 잠겼습니다.
                  trace_id: req_01HYAXIS0007
                timestamp: '2026-04-20T09:00:00Z'
    RateLimitExceeded:
      description: 요청 한도 초과
      headers:
        Retry-After:
          description: 재시도 가능 시점까지 남은 초 단위 시간
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimit:
              summary: 요청 한도 초과
              value:
                success: false
                error:
                  code: COMMON_RATE_LIMIT_EXCEEDED
                  message: 요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.
                  trace_id: req_01HYAXIS0008
                timestamp: '2026-04-20T09:00:00Z'
    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internalError:
              summary: 서버 내부 오류
              value:
                success: false
                error:
                  code: COMMON_INTERNAL_SERVER_ERROR
                  message: 서버 처리 중 오류가 발생했습니다.
                  trace_id: req_01HYAXIS0009
                timestamp: '2026-04-20T09:00:00Z'
    ServiceUnavailable:
      description: 외부 데이터 소스 또는 AI 서비스 일시 사용 불가
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            serviceUnavailable:
              summary: 외부 의존 서비스 장애
              value:
                success: false
                error:
                  code: EXTERNAL_SERVICE_UNAVAILABLE
                  message: 외부 서비스가 일시적으로 응답하지 않습니다.
                  trace_id: req_01HYAXIS0010
                timestamp: '2026-04-20T09:00:00Z'
    GatewayTimeout:
      description: 외부 서비스 또는 AI 처리 시간 초과
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            timeout:
              summary: 처리 시간 초과
              value:
                success: false
                error:
                  code: EXTERNAL_GATEWAY_TIMEOUT
                  message: 외부 서비스 응답 시간이 초과되었습니다.
                  trace_id: req_01HYAXIS0011
                timestamp: '2026-04-20T09:00:00Z'
  # 스키마
  schemas:
    # 공통 응답/에러 스키마
    ApiResponse:
      type: object
      required:
      - success
      - timestamp
      properties:
        success:
          type: boolean
        data:
          type: object
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - success
      - error
      - timestamp
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              $ref: "#/components/schemas/ErrorCodeEnum"
            message:
              type: string
              description: 사용자에게 표시 가능한 오류 메시지
            detail:
              type: string
              nullable: true
              description: 개발·운영 로그 확인용 상세 오류 설명
            field_errors:
              type: array
              nullable: true
              description: 입력값 검증 실패 상세 목록
              items:
                $ref: "#/components/schemas/FieldError"
            trace_id:
              type: string
              nullable: true
              description: 서버 로그 추적용 요청 ID
        timestamp:
          type: string
          format: date-time
    FieldError:
      type: object
      required:
      - field
      - reason
      properties:
        field:
          type: string
          description: 오류가 발생한 필드명 또는 파라미터명
          example: email
        reason:
          type: string
          description: 검증 실패 사유
          example: 올바른 이메일 형식이어야 합니다.
        rejected_value:
          type: string
          nullable: true
          description: 거절된 입력값. 민감정보는 마스킹 처리
    ErrorCodeEnum:
      type: string
      description: |
        프론트엔드 공통 에러 핸들러와 백엔드 ExceptionHandler에서 사용하는 표준 에러 코드.
        도메인 접두사:
        - COMMON: 공통 요청·서버 오류
        - AUTH: 인증·인가 오류
        - CARD: 카드 뉴스 오류
        - MONITORING: 모니터링/Peer사 분석 오류
        - BRIEFING: 브리핑 오류
        - ALERT: 알림 오류
        - BOOKMARK: 북마크 오류
        - MIXER: 믹서기 오류
        - SETTINGS: 설정 오류
        - ADMIN: 관리자 오류
        - PIPELINE: 파이프라인 오류
        - EXTERNAL: 외부 서비스 오류
      enum:
      - COMMON_BAD_REQUEST
      - COMMON_VALIDATION_ERROR
      - COMMON_UNAUTHORIZED
      - COMMON_FORBIDDEN
      - COMMON_NOT_FOUND
      - COMMON_CONFLICT
      - COMMON_RATE_LIMIT_EXCEEDED
      - COMMON_INTERNAL_SERVER_ERROR
      - AUTH_INVALID_CREDENTIALS
      - AUTH_TOKEN_EXPIRED
      - AUTH_TOKEN_INVALID
      - AUTH_REFRESH_TOKEN_INVALID
      - AUTH_EMAIL_ALREADY_EXISTS
      - AUTH_EMAIL_VERIFICATION_TOKEN_INVALID
      - AUTH_EMAIL_VERIFICATION_TOKEN_EXPIRED
      - AUTH_EMAIL_NOT_VERIFIED
      - AUTH_ACCOUNT_LOCKED
      - AUTH_FORBIDDEN
      - CARD_NOT_FOUND
      - CARD_LINK_VERIFICATION_FAILED
      - CARD_SHARE_EXPIRED
      - PEER_NOT_FOUND
      - PEER_METRIC_INVALID
      - PEER_FINANCIAL_DATA_NOT_FOUND
