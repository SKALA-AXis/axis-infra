openapi: 3.0.3
info:
  title: AXIS REST API
  description: |
    SpringBoot ↔ Frontend REST API 계약서

    모든 응답은 `{ success, data, timestamp }` 래퍼 구조를 사용합니다.

    **타입 자동 생성:**
    - Frontend: `npx openapi-typescript api/openapi.yaml -o src/types/api.ts`
    - SpringBoot: `openapi-generator-cli generate -i api/openapi.yaml -g spring`

    > 이 파일을 변경할 경우 반드시 팀 공지 후 각 레포 자동 생성을 재실행하세요.
  version: 1.0.0
  contact:
    name: SKALA AI 13조

servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://api.axis.internal
    description: Production

tags:
  - name: issues
    description: 이슈 카드
  - name: search
    description: AI 대화형 검색
  - name: peers
    description: Peer사
  - name: alerts
    description: 알림 설정
  - name: system
    description: 시스템

paths:
  /health:
    get:
      tags: [system]
      summary: 헬스체크
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                data: { status: "UP" }
                timestamp: "2026-04-20T08:30:00Z"

  /api/pipeline/status:
    get:
      tags: [system]
      summary: 파이프라인 상태 조회
      operationId: getPipelineStatus
      responses:
        '200':
          description: 파이프라인 실행 상태
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PipelineStatus'

  /api/issues:
    get:
      tags: [issues]
      summary: 이슈 카드 목록 조회
      operationId: listIssues
      parameters:
        - name: peer_id
          in: query
          schema:
            type: string
            example: samsung_sds
        - name: importance
          in: query
          schema:
            $ref: '#/components/schemas/ImportanceEnum'
        - name: event_type
          in: query
          schema:
            $ref: '#/components/schemas/EventTypeEnum'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 이슈 카드 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'
                          total:
                            type: integer
                          limit:
                            type: integer
                          offset:
                            type: integer

  /api/issues/today:
    get:
      tags: [issues]
      summary: 오늘의 브리핑 조회
      operationId: getTodayBriefing
      responses:
        '200':
          description: 오늘의 이슈 카드 목록 (urgent 우선 정렬)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          date:
                            type: string
                            format: date
                          urgent:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'
                          notable:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'
                          reference:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'

  /api/issues/{id}:
    get:
      tags: [issues]
      summary: 이슈 카드 상세 조회
      operationId: getIssueById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: IC-20260420-001
      responses:
        '200':
          description: 이슈 카드 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IssueCard'
        '404':
          description: 이슈 카드 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/search:
    post:
      tags: [search]
      summary: AI 대화형 검색
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: LG CNS 팔란티어 파트너십 현황
                peer_id:
                  type: string
                  example: lg_cns
                session_id:
                  type: string
                  description: 대화 컨텍스트 유지용 세션 ID
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SearchResponse'

  /api/search/suggestions:
    get:
      tags: [search]
      summary: 검색어 추천
      operationId: getSearchSuggestions
      parameters:
        - name: q
          in: query
          schema:
            type: string
            example: 삼성SDS AI
      responses:
        '200':
          description: 추천 검색어 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          suggestions:
                            type: array
                            items:
                              type: string

  /api/peers:
    get:
      tags: [peers]
      summary: Peer사 목록 조회
      operationId: listPeers
      responses:
        '200':
          description: Peer사 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PeerCompany'

  /api/peers/{peerId}/issues:
    get:
      tags: [peers]
      summary: Peer사별 이슈 타임라인
      operationId: getPeerIssueTimeline
      parameters:
        - name: peerId
          in: path
          required: true
          schema:
            type: string
            example: samsung_sds
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 이슈 타임라인
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          peer:
                            $ref: '#/components/schemas/PeerCompany'
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'
                          total:
                            type: integer

  /api/alerts/settings:
    get:
      tags: [alerts]
      summary: 알림 설정 조회
      operationId: getAlertSettings
      responses:
        '200':
          description: 알림 설정
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AlertSettings'
    put:
      tags: [alerts]
      summary: 알림 설정 변경
      operationId: updateAlertSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSettings'
      responses:
        '200':
          description: 변경된 알림 설정
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AlertSettings'

components:
  schemas:
    # ── 공통 래퍼 ──────────────────────────────────────────
    ApiResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [success, error, timestamp]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        timestamp:
          type: string
          format: date-time

    # ── Enum ───────────────────────────────────────────────
    ImportanceEnum:
      type: string
      enum: [urgent, notable, reference]

    EventTypeEnum:
      type: string
      enum: [partnership, ma, personnel, tech, regulation, new_biz]

    # ── 도메인 스키마 ───────────────────────────────────────
    IssueCard:
      type: object
      required: [id, peer_id, title, summary_lines, importance, created_at]
      properties:
        id:
          type: string
          example: IC-20260420-001
        peer_id:
          type: string
          example: samsung_sds
        cluster_id:
          type: integer
          nullable: true
        title:
          type: string
          example: 삼성SDS, OpenAI와 엔터프라이즈 AI 공동 사업 MOU 체결
        summary_lines:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        importance:
          $ref: '#/components/schemas/ImportanceEnum'
        importance_score:
          type: number
          format: float
        implication:
          $ref: '#/components/schemas/Implication'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        validation_pass:
          type: boolean
          nullable: true
        is_human_reviewed:
          type: boolean
        created_at:
          type: string
          format: date-time

    Implication:
      type: object
      properties:
        why_important:
          type: string
          description: SK AX 관점에서 이 이슈가 중요한 이유
        potential_impact:
          type: string
          description: SK AX에 미치는 잠재적 영향
        follow_up_questions:
          type: array
          items:
            type: string
        suggested_actions:
          type: array
          items:
            type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1

    Source:
      type: object
      required: [title, url, published_at]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        source_name:
          type: string
        published_at:
          type: string
          format: date-time
        credibility_grade:
          type: string
          enum: [High, Medium, Low, Unverified]

    SearchResponse:
      type: object
      required: [answer, citations, session_id]
      properties:
        answer:
          type: object
          properties:
            summary:
              type: string
            detail:
              type: string
            implication:
              type: string
            follow_up_questions:
              type: array
              items:
                type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        session_id:
          type: string

    PeerCompany:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: samsung_sds
        name:
          type: string
          example: 삼성SDS
        keywords:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    AlertSettings:
      type: object
      properties:
        slack_enabled:
          type: boolean
        slack_webhook_url:
          type: string
          format: uri
        briefing_time:
          type: string
          example: "08:30"
          description: 일일 브리핑 발송 시각 (HH:mm)
        notify_importance:
          type: array
          items:
            $ref: '#/components/schemas/ImportanceEnum'
          description: 알림 받을 중요도 등급
        notify_event_types:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeEnum'

    PipelineStatus:
      type: object
      properties:
        collection:
          type: object
          properties:
            last_run_at:
              type: string
              format: date-time
              nullable: true
            status:
              type: string
              enum: [idle, running, error]
            last_count:
              type: integer
        delivery:
          type: object
          properties:
            last_run_at:
              type: string
              format: date-time
              nullable: true
            status:
              type: string
              enum: [idle, running, error]
            last_count:
              type: integer
