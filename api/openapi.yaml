          type: string
          format: uri
          nullable: true
          description: 대표 원문 URL
        detailTitle:
          type: string
          nullable: true
          description: 상세 오버레이 시사점 탭 제목
        detailDescription:
          type: string
          nullable: true
          description: 카드 상세 리드 문장
        detailPoints:
          type: array
          items:
            type: string
        actionItems:
          type: array
          items:
            type: string
        mediaAssets:
          type: array
          items:
            $ref: "#/components/schemas/CardNewsMediaAsset"
        textFields:
          type: array
          items:
            $ref: "#/components/schemas/CardNewsTextField"
        valueFields:
          type: array
          items:
            $ref: "#/components/schemas/CardNewsValueField"
        displayEntries:
          type: array
