  # 모니터링
  # FR-018, FR-019, FR-021 Peer사 분석
  # FR-031, FR-032 재무·경쟁사 비교 시각화
  # FR-033, FR-034 기존 대시보드 기능 흡수
  # - 기존 /api/dashboard/* 는 /api/monitoring/overview.dashboard 로 통합
  # - 카드 뉴스 검색은 모니터링 화면 내부 기능으로 제공
  # ════════════════════════════════════════════════════════
