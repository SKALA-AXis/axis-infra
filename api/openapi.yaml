    # 카드 뉴스
    CardNews:
      type: object
      description: |
        데일리 뉴스 기반 카드 뉴스.
        홈 화면 캐러셀, 모니터링 검색, 브리핑 분석, 북마크, 믹서기 입력으로 사용합니다.
