    get:
      tags:
      - monitoring
      summary: 모니터링 첫 화면 조회
      description: |
        기존 대시보드 첫 화면을 모니터링 첫 화면으로 통합합니다.
        기간 기준, Peer사별 관찰 상태, 카드 뉴스 검색 요약, 시계열 동향, 글로벌 키워드, 재무·전략 분석 진입 정보를 반환합니다.
      operationId: getMonitoringOverview
      parameters:
      - name: period_unit
        in: query
        schema:
          $ref: "#/components/schemas/MonitoringPeriodUnitEnum"
      - name: period_value
        in: query
        description: '예: 2026, 2026Q2, 2026-05'
        schema:
          type: string
          example: 2026Q2
      - name: peer_id
        in: query
        schema:
          $ref: "#/components/schemas/PeerIdEnum"
      - name: sector
        in: query
        schema:
          $ref: "#/components/schemas/SectorEnum"
      responses:
        '200':
          description: 모니터링 첫 화면 데이터
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/MonitoringOverview"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '500':
          $ref: "#/components/responses/InternalServerError"
