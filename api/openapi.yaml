openapi: 3.0.3
info:
  title: AXIS REST API
  description: |
    SpringBoot ↔ Frontend REST API 계약서

    모든 응답은 `{ success, data, timestamp }` 래퍼 구조를 사용합니다.

    **인증:** 로그인 후 발급받은 JWT를 `Authorization: Bearer {token}` 헤더에 포함합니다.
    `/health`, `/api/auth/login`, `/api/auth/signup` 은 인증 불필요.

    **타입 자동 생성:**
    - Frontend: `npx openapi-typescript api/openapi.yaml -o src/types/api.ts`
    - SpringBoot: `openapi-generator-cli generate -i api/openapi.yaml -g spring`

    > 이 파일을 변경할 경우 반드시 팀 공지 후 각 레포 자동 생성을 재실행하세요.

    **v3 변경 (1차 미팅 확정):**
    - 노출도 산식: LLM 5축 → 결정적 산식. `ImportanceEnum`(urgent/notable/reference) 폐기, `ExposureBandEnum`(high/medium/low) 도입.
    - 트렌드 섹터 5종(`SectorEnum`) 신설.
    - 환각 방지: SC 검증 → `EvidenceChain` 4종 첨부(source_links / provenance / financial_refs / mbb_refs). SC는 `/api/search`(generative)에만 잔존.
    - 알림: Slack Webhook → 이메일(SMTP) 전환. `AlertSettings.slack_*` 필드 폐기.
    - Peer 4사 확정: samsung_sds / lg_cns / hyundai_autoever / posco_dx.
    - 약한 신호(`/api/weak-signals`)는 W7까지 보류 (deprecated 마킹).
  version: 1.2.0
  contact:
    name: SKALA AI 13조

servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://api.axis.internal
    description: Production

tags:
  - name: auth
    description: 인증
  - name: issues
    description: 이슈 카드
  - name: search
    description: AI 대화형 검색
  - name: peers
    description: Peer사
  - name: weak-signals
    description: 약한 신호
  - name: alerts
    description: 알림 설정
  - name: pipeline
    description: 파이프라인 (관리자용)
  - name: system
    description: 시스템

security:
  - BearerAuth: []

paths:
  # ── 시스템 ────────────────────────────────────────────────
  /health:
    get:
      tags: [system]
      summary: 헬스체크
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                data: { status: "UP" }
                timestamp: "2026-04-20T08:30:00Z"

  # ── 인증 ─────────────────────────────────────────────────
  /api/auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      description: 내부 사용자 계정 생성. 관리자가 신규 팀원에게 계정을 발급할 때 사용.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                  example: user@sk.com
                password:
                  type: string
                  minLength: 8
                  example: "password123!"
                name:
                  type: string
                  example: 홍길동
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 존재하는 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@sk.com
                password:
                  type: string
                  example: "password123!"
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [access_token, refresh_token, user]
                        properties:
                          access_token:
                            type: string
                            description: JWT Access Token (24시간 유효)
                          refresh_token:
                            type: string
                            description: Refresh Token (7일 유효)
                          user:
                            $ref: '#/components/schemas/UserProfile'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      description: 서버 측 refresh token 무효화.
      operationId: logout
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Access Token 갱신
      description: Refresh Token으로 새 Access Token을 발급받습니다.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [access_token]
                        properties:
                          access_token:
                            type: string
                            description: 새 JWT Access Token (24시간 유효)
        '401':
          description: 유효하지 않거나 만료된 Refresh Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags: [auth]
      summary: 내 정보 조회
      operationId: getMe
      responses:
        '200':
          description: 현재 로그인 사용자 정보
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── 이슈 카드 ──────────────────────────────────────────────
  /api/issues:
    get:
      tags: [issues]
      summary: 이슈 카드 목록 조회
      operationId: listIssues
      parameters:
        - name: peer_id
          in: query
          schema:
            $ref: '#/components/schemas/PeerIdEnum'
        - name: exposure_band
          in: query
          description: v3 노출도 밴드 필터
          schema:
            $ref: '#/components/schemas/ExposureBandEnum'
        - name: sector
          in: query
          description: v3 트렌드 섹터 필터
          schema:
            $ref: '#/components/schemas/SectorEnum'
        - name: importance
          in: query
          deprecated: true
          description: v1 호환 — v3에서는 exposure_band 사용
          schema:
            $ref: '#/components/schemas/ImportanceEnum'
        - name: event_type
          in: query
          schema:
            $ref: '#/components/schemas/EventTypeEnum'
        - name: date_from
          in: query
          schema:
            type: string
            format: date
            example: "2026-04-01"
        - name: date_to
          in: query
          schema:
            type: string
            format: date
            example: "2026-04-20"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 이슈 카드 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'
                          total:
                            type: integer
                          limit:
                            type: integer
                          offset:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/issues/today:
    get:
      tags: [issues]
      summary: 오늘의 브리핑 조회
      description: v3 — 노출도 밴드(high → medium → low) 순으로 그룹핑된 동향 카드 반환.
      operationId: getTodayBriefing
      responses:
        '200':
          description: 오늘의 동향 카드 목록 (high → medium → low 순)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [date, high, medium, low]
                        properties:
                          date:
                            type: string
                            format: date
                          high:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'
                          medium:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'
                          low:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/issues/{id}:
    get:
      tags: [issues]
      summary: 이슈 카드 상세 조회
      operationId: getIssueById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: IC-20260420-001
      responses:
        '200':
          description: 이슈 카드 상세
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/IssueCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── 검색 ──────────────────────────────────────────────────
  /api/search:
    post:
      tags: [search]
      summary: AI 대화형 검색 (Generative Search)
      description: BGE-M3 하이브리드 검색 + GPT-4o 생성. SC 검증 포함.
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: LG CNS 팔란티어 파트너십 현황
                peer_id:
                  type: string
                  nullable: true
                  example: lg_cns
                session_id:
                  type: string
                  nullable: true
                  description: 대화 컨텍스트 유지용 세션 ID (후속 질문 시 포함)
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/search/suggestions:
    get:
      tags: [search]
      summary: 검색어 추천
      operationId: getSearchSuggestions
      parameters:
        - name: q
          in: query
          schema:
            type: string
            example: 삼성SDS AI
      responses:
        '200':
          description: 추천 검색어 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          suggestions:
                            type: array
                            items:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/search/history:
    get:
      tags: [search]
      summary: 검색 히스토리 조회
      description: 현재 사용자의 최근 검색 기록을 반환합니다.
      operationId: getSearchHistory
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 검색 히스토리
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/SearchHistoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [search]
      summary: 검색 히스토리 전체 삭제
      operationId: clearSearchHistory
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Peer사 ────────────────────────────────────────────────
  /api/peers:
    get:
      tags: [peers]
      summary: Peer사 목록 조회
      operationId: listPeers
      responses:
        '200':
          description: Peer사 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PeerCompany'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/peers/{peerId}/issues:
    get:
      tags: [peers]
      summary: Peer사별 이슈 타임라인
      operationId: getPeerIssueTimeline
      parameters:
        - name: peerId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PeerIdEnum'
        - name: event_type
          in: query
          schema:
            $ref: '#/components/schemas/EventTypeEnum'
        - name: sector
          in: query
          description: v3 트렌드 섹터 필터
          schema:
            $ref: '#/components/schemas/SectorEnum'
        - name: exposure_band
          in: query
          description: v3 노출도 밴드 필터
          schema:
            $ref: '#/components/schemas/ExposureBandEnum'
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Peer사별 이슈 타임라인
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          peer:
                            $ref: '#/components/schemas/PeerCompany'
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/IssueCard'
                          total:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── 약한 신호 ──────────────────────────────────────────────
  /api/weak-signals:
    get:
      tags: [weak-signals]
      summary: 약한 신호 목록 조회 (W7 활성 예정 — 현재 미구현)
      description: |
        채용공고 급증·신규 직군 출현 등 아직 보도되지 않은 전략 변화 신호.
        매주 월요일 오전 9시 자동 갱신.

        **상태**: v3에서 weak_signal_agent 보류 (axis-ai/_deprecated/). W7(7주차)에 재구현 예정.
        호출 시 빈 배열 반환 가능.
      operationId: listWeakSignals
      deprecated: true
      parameters:
        - name: peer_id
          in: query
          schema:
            type: string
            example: lg_cns
        - name: strength
          in: query
          schema:
            type: string
            enum: [weak, medium, strong]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 약한 신호 목록
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/WeakSignal'
                          total:
                            type: integer
                          last_updated_at:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── 알림 설정 ──────────────────────────────────────────────
  /api/alerts/settings:
    get:
      tags: [alerts]
      summary: 알림 설정 조회
      operationId: getAlertSettings
      responses:
        '200':
          description: 알림 설정
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AlertSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [alerts]
      summary: 알림 설정 변경
      operationId: updateAlertSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSettings'
      responses:
        '200':
          description: 변경된 알림 설정
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AlertSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/alerts/test:
    post:
      tags: [alerts]
      summary: 테스트 알림 발송
      description: |
        v3 — 현재 이메일(SMTP) 설정이 올바른지 확인하기 위한 테스트 메일 발송.
        (v1의 Slack Webhook 발송은 폐기.)
      operationId: sendTestAlert
      responses:
        '200':
          description: 테스트 이메일 발송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: SMTP 설정 미완료 또는 수신자 미지정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── 파이프라인 (관리자용) ────────────────────────────────────
  /api/pipeline/status:
    get:
      tags: [pipeline]
      summary: 파이프라인 상태 조회
      operationId: getPipelineStatus
      responses:
        '200':
          description: 파이프라인 실행 상태
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PipelineStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/pipeline/trigger:
    post:
      tags: [pipeline]
      summary: 수동 파이프라인 실행 (관리자용)
      description: 스케줄 대기 없이 즉시 수집 파이프라인을 실행합니다.
      operationId: triggerPipeline
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                peer_ids:
                  type: array
                  items:
                    type: string
                  description: 수집 대상 Peer사 ID (미입력 시 전체)
                  example: ["samsung_sds", "lg_cns"]
      responses:
        '202':
          description: 파이프라인 실행 시작
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          run_id:
                            type: string
                            description: 실행 추적용 ID
                          message:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 이미 실행 중인 파이프라인 존재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인 후 발급받은 JWT Access Token

  responses:
    Unauthorized:
      description: 인증 필요 (토큰 없음 또는 만료)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: 인증이 필요합니다.
            timestamp: "2026-04-20T08:30:00Z"

    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: 접근 권한이 없습니다.
            timestamp: "2026-04-20T08:30:00Z"

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: 요청한 리소스를 찾을 수 없습니다.
            timestamp: "2026-04-20T08:30:00Z"

    BadRequest:
      description: 잘못된 요청 (입력값 오류)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_INPUT
              message: 입력값이 올바르지 않습니다.
            timestamp: "2026-04-20T08:30:00Z"

  schemas:
    # ── 공통 래퍼 ──────────────────────────────────────────
    ApiResponse:
      type: object
      required: [success, data, timestamp]
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [success, error, timestamp]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: 요청한 리소스를 찾을 수 없습니다.
        timestamp:
          type: string
          format: date-time

    # ── Enum ──────────────────────────────────────────────
    ImportanceEnum:
      type: string
      deprecated: true
      enum: [urgent, notable, reference, high, medium, low]
      description: |
        v1 호환 — v3에서는 ExposureBandEnum(high/medium/low) 사용.
        DB(issue_cards.importance) 컬럼은 v3 진입 후 high/medium/low를 저장.
        - (v1) urgent / notable / reference
        - (v3) high / medium / low

    ExposureBandEnum:
      type: string
      enum: [high, medium, low]
      description: |
        v3 노출도 밴드 — 결정적 산식 기반.
        exposure_score = 0.40·cluster_size + 0.30·credibility_max + 0.20·peer_mention + 0.10·tier1_diversity
        - high:   ≥ 0.70
        - medium: 0.40 ~ 0.70
        - low:    < 0.40

    SectorEnum:
      type: string
      enum: [security, ai_tech, large_deal, sk_ax_biz, other]
      description: |
        v3 트렌드 섹터 5종 (1차 미팅 확정).
        - security: 보안
        - ai_tech: AI 기술
        - large_deal: 대형 수주
        - sk_ax_biz: SK AX 사업
        - other: 기타

    PeerIdEnum:
      type: string
      enum: [samsung_sds, lg_cns, hyundai_autoever, posco_dx]
      description: 모니터링 대상 Peer 4사 (v3 확정).

    EventTypeEnum:
      type: string
      enum: [partnership, ma, personnel, tech, regulation, new_biz]
      description: |
        - partnership: 파트너십·제휴
        - ma: M&A·투자·IPO
        - personnel: 인사·조직 개편
        - tech: 기술 발표·제품 출시
        - regulation: 규제·정책
        - new_biz: 신규 사업 진출

    # ── 사용자 ────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@sk.com
        name:
          type: string
          example: 홍길동
        created_at:
          type: string
          format: date-time

    # ── 이슈 카드 ─────────────────────────────────────────
    IssueCard:
      type: object
      description: 동향 카드 — v3 진입 후 'issue card' 명칭은 호환을 위해 유지.
      required: [id, peer_id, title, summary_lines, created_at]
      properties:
        id:
          type: string
          example: IC-20260420-001
        peer_id:
          $ref: '#/components/schemas/PeerIdEnum'
        cluster_id:
          type: integer
          nullable: true
        title:
          type: string
          example: 삼성SDS, OpenAI와 엔터프라이즈 AI 공동 사업 MOU 체결
        summary_lines:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
          description: 3줄 요약
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        sector:
          $ref: '#/components/schemas/SectorEnum'
        exposure_band:
          $ref: '#/components/schemas/ExposureBandEnum'
        exposure_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: v3 결정적 노출도 산식 (0~1)
        importance:
          allOf:
            - $ref: '#/components/schemas/ImportanceEnum'
          deprecated: true
          description: v1 호환 — v3에서는 exposure_band 사용
        importance_score:
          type: number
          format: float
          deprecated: true
          minimum: 0
          maximum: 100
          description: v1 호환 — v3에서는 exposure_score(0~1) 사용
        implication:
          $ref: '#/components/schemas/Implication'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        evidence_chain:
          $ref: '#/components/schemas/EvidenceChain'
        validation_pass:
          type: boolean
          nullable: true
          description: |
            v3 — Evidence Chain 4종 첨부 통과 여부.
            (v1의 SC 검증 통과 여부에서 의미 전환)
        is_human_reviewed:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time

    Implication:
      type: object
      description: |
        SK AX 관점의 시사점 (AI 초안).
        v3 — Evidence Chain 4종 첨부로 환각 방지 (SC 검증 폐기, /gen-search에만 잔존).
      properties:
        why_important:
          type: string
          description: SK AX 관점에서 이 이슈가 중요한 이유
        potential_impact:
          type: string
          description: SK AX에 미치는 잠재적 영향
        follow_up_questions:
          type: array
          items:
            type: string
          description: 후속 확인이 필요한 질문
        suggested_actions:
          type: array
          items:
            type: string
          description: SK AX에게 권장되는 액션 아이템
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 0.6 미만이면 '근거 불충분' 레이블 표시

    Source:
      type: object
      required: [title, url, published_at]
      properties:
        index:
          type: integer
          description: 인용 번호 ([1], [2] 형태로 본문에서 참조)
        title:
          type: string
        url:
          type: string
          format: uri
        source_name:
          type: string
        published_at:
          type: string
          format: date-time
        credibility_grade:
          type: string
          enum: [High, Medium, Low, Unverified]
        credibility_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: v3 — 0~1 범위 신뢰도 점수 (grade와 별개로 노출)

    # ── 검증 체인 (v3 §3.2, §5.6) ─────────────────────────
    EvidenceChain:
      type: object
      description: |
        v3 검증 4종 — 모든 동향 카드에 자동 첨부.
        누락 시 pass=false + human_review 플래그.
      properties:
        source_links:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              source_name: { type: string }
              url: { type: string }
              credibility_score: { type: number, format: float }
        provenance:
          type: object
          properties:
            raw_article_ids:
              type: array
              items: { type: integer }
            cluster_id: { type: integer }
            llm_model: { type: string, example: "gpt-4o" }
            prompt_version: { type: string, example: "ic-v3.0" }
            evidence_version: { type: string, example: "v3.0" }
            run_at: { type: string, format: date-time }
        financial_refs:
          type: array
          description: 분기별 재무 변화 ref (DART 공시번호·IR 페이지 포함)
          items:
            type: object
            properties:
              period: { type: string, example: "2026Q1" }
              metric: { type: string }
              metric_ko: { type: string }
              value_krwbn: { type: number, format: float, nullable: true }
              value_pct: { type: number, format: float, nullable: true }
              delta_pct_qoq: { type: number, format: float, nullable: true }
              delta_pct_yoy: { type: number, format: float, nullable: true }
              dart_rcept_no: { type: string, nullable: true }
              ir_page: { type: integer, nullable: true }
              narrative: { type: string }
        mbb_refs:
          type: array
          description: 컨설팅사 보고서 자동 매칭 (W5 활성)
          items:
            type: object
        financial_link:
          type: object
          properties:
            linked: { type: boolean }
            reason: { type: string }
            segment:
              type: object
              nullable: true
              properties:
                id: { type: string }
                name_ko: { type: string }
                match_keyword_hits: { type: integer }
            highlights:
              type: array
              items: { type: string }
            headcount_delta:
              type: object
              nullable: true
        evidence_version:
          type: string
          example: "v3.0"
        pass:
          type: boolean
          description: 4종 모두 첨부됐는지
        missing:
          type: array
          items: { type: string }
          description: pass=false 시 누락 항목

    # ── 검색 ─────────────────────────────────────────────
    SearchResponse:
      type: object
      required: [answer, citations, session_id]
      properties:
        answer:
          type: object
          properties:
            summary:
              type: string
            detail:
              type: string
            implication:
              type: string
              description: SK AX 관점 시사점
            follow_up_questions:
              type: array
              items:
                type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        session_id:
          type: string
          description: 후속 질문 시 이 값을 포함해서 요청
        sc_passed:
          type: boolean
          description: Self-Consistency 검증 통과 여부

    SearchHistoryItem:
      type: object
      required: [id, query, created_at]
      properties:
        id:
          type: integer
        query:
          type: string
          example: LG CNS 팔란티어 파트너십
        session_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Peer사 ───────────────────────────────────────────
    PeerCompany:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/PeerIdEnum'
        name:
          type: string
          example: 삼성SDS
        keywords:
          type: array
          items:
            type: string
          description: 모니터링 키워드 목록
        is_active:
          type: boolean
          default: true

    # ── 약한 신호 ────────────────────────────────────────
    WeakSignal:
      type: object
      required: [id, peer_id, signal_type, strength, description, detected_at]
      properties:
        id:
          type: integer
        peer_id:
          type: string
          example: lg_cns
        signal_type:
          type: string
          enum: [hiring_surge, tech_stack_new, tech_stack_drop, org_expansion]
          description: |
            - hiring_surge: 특정 기술 채용공고 급증 (지난 4주 평균 대비 3배 이상)
            - tech_stack_new: 신규 기술 스택 출현 (3개월 내 첫 등장)
            - tech_stack_drop: 기존 기술 스택 급감
            - org_expansion: 특정 사업부 채용 비중 급증
        strength:
          type: string
          enum: [weak, medium, strong]
        description:
          type: string
          example: LG CNS 팔란티어 관련 채용 4주간 1건 → 5건 증가
        evidence:
          type: object
          description: 근거 데이터 (기간, 수치, 출처 링크 등)
          additionalProperties: true
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        detected_at:
          type: string
          format: date-time
        snapshot_week:
          type: string
          format: date
          description: 분석 기준 주 (월요일 날짜)

    # ── 알림 (v3 — Slack 폐기, 이메일 전환) ────────────────────
    AlertSettings:
      type: object
      properties:
        email_enabled:
          type: boolean
          default: false
          description: v3 — 이메일 브리핑 활성화 여부
        email_recipients:
          type: array
          items:
            type: string
            format: email
          description: 브리핑 수신자 이메일 목록
          example: ["user1@sk.com", "user2@sk.com"]
        briefing_time:
          type: string
          example: "08:30"
          description: 일일 브리핑 발송 시각 (HH:mm, KST)
        notify_exposure_bands:
          type: array
          items:
            $ref: '#/components/schemas/ExposureBandEnum'
          description: v3 — 알림 받을 노출도 밴드
          example: [high, medium]
        notify_sectors:
          type: array
          items:
            $ref: '#/components/schemas/SectorEnum'
          description: v3 — 알림 받을 트렌드 섹터 (빈 배열이면 전체)
        notify_event_types:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeEnum'
          description: 알림 받을 이벤트 타입 (빈 배열이면 전체)

    # ── 파이프라인 ───────────────────────────────────────
    PipelineStatus:
      type: object
      properties:
        collection:
          type: object
          properties:
            last_run_at:
              type: string
              format: date-time
              nullable: true
            status:
              type: string
              enum: [idle, running, error]
            last_count:
              type: integer
              description: 마지막 실행에서 수집된 기사 수
        delivery:
          type: object
          properties:
            last_run_at:
              type: string
              format: date-time
              nullable: true
            status:
              type: string
              enum: [idle, running, error]
            last_count:
              type: integer
              description: 마지막 실행에서 생성된 이슈 카드 수
