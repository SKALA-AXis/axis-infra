          type: string
          format: date-time
        related_card_id:
          type: string
          nullable: true
    # 알림·설정·로그
    Alert:
      type: object
      description: FR-024 선제적 이벤트 탐지 결과
      required:
      - id
      - type
      - title
      - created_at
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - event
          - briefing
          - system
        title:
          type: string
        summary:
          type: string
        card_id:
          type: string
          nullable: true
          description: 카드 뉴스 ID. CardNews.id 값을 사용합니다.
        is_read:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
    AlertRules:
      type: object
      description: FR-040 알림 키워드·조건 커스터마이징
      properties:
        keywords:
          type: array
          items:
            type: string
        excluded_keywords:
          type: array
          items:
            type: string
        peers:
          type: array
          items:
            $ref: "#/components/schemas/PeerIdEnum"
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorEnum"
        event_types:
          type: array
          items:
            $ref: "#/components/schemas/EventTypeEnum"
        min_exposure_band:
          $ref: "#/components/schemas/ExposureBandEnum"
    NotificationSettings:
      type: object
      description: FR-041 알림 채널·시간 설정
      properties:
        channels:
          type: object
          properties:
            email:
              type: boolean
              default: true
            ms_teams:
              type: boolean
              default: false
            in_app:
              type: boolean
              default: true
        email_recipients:
          type: array
          items:
            type: string
            format: email
        ms_teams_webhook_url:
          type: string
          nullable: true
        schedule:
          type: object
          properties:
            briefing_time:
              type: string
              example: 30600
            event_immediate:
              type: boolean
              default: true
            weekly_summary:
              type: boolean
              default: false
    AccessLog:
      type: object
      description: FR-043 개인별 접속 로그
      properties:
        id:
          type: integer
        action:
          type: string
          enum:
          - login
          - logout
          - view
          - download
          - share
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
    AuditLog:
      type: object
      description: 관리자용 전체 감사 로그
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_email:
          type: string
        action_type:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        ip_address:
          type: string
        details:
          type: object
        created_at:
          type: string
          format: date-time
    # 믹서기
    MixerResult:
      type: object
      description: FR-038 믹서기 에이전트 결과
      required:
      - mix_id
      - source_card_ids
      - generated_implication
      properties:
        mix_id:
          type: string
        source_card_ids:
          type: array
          items:
            type: string
          description: 카드 뉴스 ID 목록. CardNews.id 값을 사용합니다.
        user_question:
          type: string
          nullable: true
        generated_implication:
          type: object
          properties:
            summary:
              type: string
            connections:
              type: array
              items:
                type: string
            sk_ax_perspective:
              type: string
            confidence:
              type: number
              format: float
        created_at:
          type: string
          format: date-time
    # 관리자 콘솔
    DataSource:
      type: object
      required:
      - id
      - name
      - type
      - is_active
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - news_api
          - rss
          - dart
          - kipris
          - jobspy
          - datalab
          - ir_pdf
          - mbb_rss
          - threads
          description: |
            FR-003 (news_api, rss): 뉴스 크롤링
            FR-004 (ir_pdf): IR 자료 크롤링
            FR-005 (rss): 증권사 데일리 리포트
            FR-006 (dart): DART 공시
            FR-007 (jobspy): 채용 공고 (고용24)
            FR-008 (datalab): 검색량
            FR-009 (rss/mbb_rss): SPRi, Mckinsey
            FR-010 (threads): 글로벌 동향 키워드
        url:
          type: string
        cron_expression:
          type: string
        is_active:
          type: boolean
        last_run_at:
          type: string
          format: date-time
          nullable: true
        last_count:
          type: integer
          nullable: true
    PromptTemplate:
      type: object
      required:
      - id
      - name
      - content
      properties:
        id:
          type: string
        name:
          type: string
        agent_type:
          type: string
          enum:
          - classification
          - summary
          - analysis
          - implication
          - validation
          description: |
            FR-013 classification: 본문 라벨링
            FR-015 summary: 본문 요약
            FR-014 analysis: 본문 분석
            FR-020/FR-023 implication: SK AX 시사점
            FR-016 validation: 검증
        content:
          type: string
        variables:
          type: array
          items:
            type: string
        version:
          type: string
        updated_at:
          type: string
          format: date-time
    SchedulerJob:
      type: object
      required:
      - id
      - name
      - cron_expression
      - is_active
      properties:
        id:
          type: string
        name:
          type: string
        cron_expression:
          type: string
          example: 0 30 8 * * MON-FRI
        target_pipeline:
          type: string
          enum:
          - collection
          - analysis
          - delivery
        is_active:
          type: boolean
        last_run_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
          nullable: true
    UsageStats:
      type: object
      properties:
        period:
          type: string
        token_usage:
          type: object
          properties:
            total:
              type: integer
            by_agent:
              type: object
              additionalProperties:
                type: integer
        cost_krw:
          type: object
          properties:
            total:
              type: number
            by_provider:
              type: object
              additionalProperties:
                type: number
        api_calls:
          type: integer
        budget_used_pct:
          type: number
    # 파이프라인
    PipelineStatus:
      type: object
      properties:
        collection:
          type: object
          properties:
            last_run_at:
              type: string
              format: date-time
              nullable: true
            status:
              type: string
              enum:
              - idle
              - running
              - error
            last_count:
              type: integer
        delivery:
          type: object
          properties:
            last_run_at:
              type: string
              format: date-time
              nullable: true
            status:
              type: string
              enum:
              - idle
              - running
              - error
            last_count:
              type: integer
