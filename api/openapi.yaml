  # 원문 아카이브 / 플로팅 AI 채팅
  # ════════════════════════════════════════════════════════
  /api/raw-articles:
    get:
      tags:
      - raw-articles
      summary: 원문 기사 아카이브 목록
      description: |
        PostgreSQL에 보관된 크롤링 원문 메타데이터를 조회합니다.
        Qdrant payload에는 원문 전체 텍스트를 저장하지 않는 원칙을 유지하고, 필요 시 이 API로 원문 메타를 확인합니다.
      operationId: listRawArticles
      parameters:
      - name: peer_id
        in: query
        schema:
          $ref: "#/components/schemas/PeerIdEnum"
      - name: importance_level
        in: query
        schema:
          type: string
          enum:
          - urgent
          - notable
      - name: processing_status
        in: query
        schema:
          type: string
          enum:
          - RAW
          - EMBEDDED
          - SKIPPED_QUALITY
          - SKIPPED_CREDIBILITY
          - CLUSTERED_DUPE
          - ERROR
      - name: q
        in: query
        schema:
          type: string
      - name: date_from
        in: query
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        schema:
          type: string
          format: date
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - collected_desc
          - published_desc
          - importance_desc
          default: collected_desc
      - name: limit
        in: query
        schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: 원문 기사 목록
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/RawArticleListResponse"
              examples:
                success:
                  value:
                    success: true
                    data:
                      items:
                      - id: 101
                        title: LG CNS 금융권 AI 보안 패키지 출시
                        url: https://example.com/news/101
                        sourceName: 전자신문
                        peerId: lg_cns
                        publishedAt: '2026-05-11T08:30:00+09:00'
                        collectedAt: '2026-05-11T08:35:00+09:00'
                        importanceLevel: notable
                        processingStatus: EMBEDDED
                      total: 1
                      limit: 30
                      offset: 0
                    timestamp: '2026-05-11T00:00:00Z'
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '500':
          $ref: "#/components/responses/InternalServerError"
