  # ════════════════════════════════════════════════════════
  # FR-026 카드 뉴스 / FR-027 출처 링크 / FR-028 카드 뉴스 검색·필터
  # - card-news 별도 도메인 없이 /api/cards로 통일
  # - 홈 캐러셀, 카드 뉴스 목록, 상세, 출처 검증에서 사용
  # ════════════════════════════════════════════════════════
  /api/cards:
    get:
      tags:
      - cards
      summary: 카드 뉴스 목록 (FR-026, FR-028)
      description: |
        카드 뉴스 목록을 조회합니다.
        홈 화면 카드 캐러셀, 카드 뉴스 목록, 북마크, 믹서기 카드 선택 화면에서 공통으로 사용합니다.
        검색어(q)와 필터는 모니터링/브리핑 화면 내부 검색에서도 동일한 조건으로 재사용됩니다.
      operationId: listCards
      parameters:
      - name: q
        in: query
        description: 카드 뉴스 제목, 요약, 본문, 출처 기준 검색어
        schema:
          type: string
      - name: peer_id
        in: query
        schema:
          $ref: "#/components/schemas/PeerIdEnum"
      - name: sector
        in: query
        schema:
          $ref: "#/components/schemas/SectorEnum"
      - name: exposure_band
        in: query
        schema:
          $ref: "#/components/schemas/ExposureBandEnum"
      - name: event_type
        in: query
        schema:
          $ref: "#/components/schemas/EventTypeEnum"
      - name: date_from
        in: query
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        schema:
          type: string
          format: date
      - name: source_name
        in: query
        description: 언론사, 공시, IR, 리포트 등 출처명 필터
        schema:
          type: string
      - name: has_financial_context
        in: query
        description: 재무 연결 분석 결과가 있는 카드만 조회
        schema:
          type: boolean
      - name: bookmarked_only
        in: query
        description: 내 북마크 카드만 조회
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - latest
          - exposure_desc
          - trust_desc
          - relevance
          default: latest
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      responses:
        '200':
          description: 카드 뉴스 목록
          content:
            application/json:
              schema:
                allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - type: object
                  properties:
                    data:
                      $ref: "#/components/schemas/CardListResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '500':
          $ref: "#/components/responses/InternalServerError"
