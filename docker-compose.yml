version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: axis-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axis}
      POSTGRES_USER: ${POSTGRES_USER:-axuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axuser} -d ${POSTGRES_DB:-axis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: axis-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "grep -qE ':18BD ' /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../axis-backend
      dockerfile: Dockerfile
    container_name: axis-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-axis}
      DB_USERNAME: ${POSTGRES_USER:-axuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-axpass}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai:8001}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ../axis-ai
      dockerfile: Dockerfile
    container_name: axis-ai
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      DART_API_KEY: ${DART_API_KEY}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../axis-frontend
      dockerfile: Dockerfile
    container_name: axis-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_storage:

networks:
  default:
    name: axis-network
