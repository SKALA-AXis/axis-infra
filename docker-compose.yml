# 로컬 전체 실행용. PostgreSQL은 Supabase, Qdrant는 Qdrant Cloud를 사용한다.
# DB/벡터스토어 컨테이너는 더 이상 띄우지 않는다 — 모든 연결 정보는 .env에서 주입.

services:
  backend:
    build:
      context: ../axis-backend
      dockerfile: Dockerfile
    container_name: axis-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai:8001}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ../axis-ai
      dockerfile: Dockerfile
    container_name: axis-ai
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      DART_API_KEY: ${DART_API_KEY}
      KIPRIS_API_KEY: ${KIPRIS_API_KEY}
      SARAMIN_API_KEY: ${SARAMIN_API_KEY}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../axis-frontend
      dockerfile: Dockerfile
    container_name: axis-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: axis-network
