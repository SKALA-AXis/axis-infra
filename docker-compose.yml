# 작성일: 2026-04-21
# 작성자: 최종민
# 변경이력:
#   2026-04-21 최종민 — compose 베이스라인 작성, obsolete version 키 제거, Supabase+Qdrant Cloud 전환 및 local 프로파일 복구, 카드뉴스 이미지 공유 볼륨, WORK24 API 키 전파, Qdrant v1.9.4 핀
#   2026-05-07 박지원 — DB 스키마 업데이트 반영, naver id 수정
#   2026-06-08 박진 — Qdrant 런타임 업그레이드, 목업 삭제 및 챗봇 고도화 반영
# 두 가지 모드 지원:
#  - cluster-db (권장): host port-forward로 SKALA EKS Postgres/Qdrant에 연결.
#       make up-cluster
#  - local (옵션): postgres + qdrant 컨테이너를 같이 띄우고, 그쪽으로 ai/backend가 붙는다.
#       docker compose --profile local --env-file .env.local up -d
#
# 옛 Supabase/Qdrant Cloud 기본 모드는 폐기됨. .env.local.example를 .env.local로
# 복사한 뒤 local 모드에서만 `--env-file` 로 명시한다.

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local"]
    container_name: axis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axis}
      POSTGRES_USER: ${POSTGRES_USER:-axuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axuser} -d ${POSTGRES_DB:-axis}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.4
    profiles: ["local"]
    container_name: axis-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ../axis-backend
      dockerfile: Dockerfile
    container_name: axis-backend
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AI_SERVER_URL: ${AI_SERVER_URL:-http://ai:8001}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/data/images}
    ports:
      - "8080:8080"
    volumes:
      # 카드 뉴스 이미지 — axis-ai가 write, backend는 read-only
      - axis-images:/data/images:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ../axis-ai
      dockerfile: Dockerfile
    container_name: axis-ai
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      NAVER_CLIENT_IDS: ${NAVER_CLIENT_IDS:-}
      NAVER_CLIENT_SECRETS: ${NAVER_CLIENT_SECRETS:-}
      DART_API_KEY: ${DART_API_KEY}
      KIPRIS_API_KEY: ${KIPRIS_API_KEY}
      WORK24_API_KEY: ${WORK24_API_KEY}
      WORK24_RETURN_TYPE: ${WORK24_RETURN_TYPE:-XML}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/data/images}
    ports:
      - "8001:8001"
    volumes:
      # 카드 뉴스 이미지 — ImageFetchAgent가 다운로드해서 적재 (write)
      - axis-images:/data/images
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../axis-frontend
      dockerfile: Dockerfile
    container_name: axis-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  # 카드 뉴스 이미지 공유 볼륨 — ai(write) ↔ backend(read)
  axis-images:

networks:
  default:
    name: axis-network
