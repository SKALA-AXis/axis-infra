name: Validate Specs

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sql:
    name: Validate SQL Schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: axis_test
          POSTGRES_USER: axuser
          POSTGRES_PASSWORD: axpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axuser -d axis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Run schema.sql against test DB
        env:
          PGPASSWORD: axpass
        run: |
          psql -h localhost -U axuser -d axis_test -f db/schema.sql
          echo "schema.sql validated successfully"

  validate-openapi:
    name: Validate OpenAPI Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install swagger-cli
        run: npm install -g @apidevtools/swagger-cli

      - name: Validate openapi.yaml
        run: swagger-cli validate api/openapi.yaml

      - name: Validate ai-internal-api.yaml
        run: swagger-cli validate api/ai-internal-api.yaml

  notify-spec-change:
    name: Notify API Spec Change
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for API spec changes
        id: check-changes
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'api/openapi.yaml' 'api/ai-internal-api.yaml')
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "files=$CHANGED" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment on spec change
        if: steps.check-changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = process.env.CHANGED_FILES.trim().split('\n');
            const fileList = changedFiles.map(f => `- \`${f}\``).join('\n');
            const body = [
              '## ⚠️ API 스펙 변경 감지',
              '',
              '다음 API 스펙 파일이 변경되었습니다:',
              fileList,
              '',
              '**각 레포에서 타입 자동 생성을 재실행해야 합니다:**',
              '',
              '**axis-frontend:**',
              '```bash',
              'npx openapi-typescript ../axis-infra/api/openapi.yaml -o src/types/api.ts',
              '```',
              '',
              '**axis-backend:**',
              '```bash',
              'openapi-generator-cli generate -i ../axis-infra/api/openapi.yaml -g spring -o ./generated',
              '```',
              '',
              '**axis-ai:**',
              '```bash',
              'datamodel-codegen --input ../axis-infra/api/ai-internal-api.yaml --output src/schemas.py',
              '```',
              '',
              '> 이 PR이 머지되기 전에 관련 레포 PR을 함께 준비해주세요.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
        env:
          CHANGED_FILES: ${{ steps.check-changes.outputs.files }}
