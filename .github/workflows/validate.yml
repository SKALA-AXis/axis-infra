name: Validate Specs

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gitleaks-action@v2 는 GitHub org 에 유료 GITLEAKS_LICENSE 필요.
      # OSS CLI 로 working tree 만 스캔 (--no-git: REPLACE_* placeholder git history 제외).
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=v8.21.2
          TMP_DIR="$(mktemp -d)"
          ARCHIVE="${TMP_DIR}/gitleaks.tar.gz"
          if curl -fsSL --retry 8 --retry-delay 2 --retry-max-time 300 --retry-all-errors \
            -o "${ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" \
            && tar -xzf "${ARCHIVE}" -C "${TMP_DIR}" gitleaks; then
            install "${TMP_DIR}/gitleaks" /usr/local/bin/gitleaks
          else
            echo "::warning::gitleaks release download failed; falling back to go install"
            go install "github.com/gitleaks/gitleaks/v8@${GITLEAKS_VERSION}"
            install "$(go env GOPATH)/bin/gitleaks" /usr/local/bin/gitleaks
          fi
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --verbose

  validate-sql:
    name: Validate SQL Schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: axis_test
          POSTGRES_USER: axuser
          POSTGRES_PASSWORD: axpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axuser -d axis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Run schema.sql against test DB
        env:
          PGPASSWORD: axpass
        run: |
          psql -h localhost -U axuser -d axis_test -f db/schema.sql
          echo "schema.sql validated successfully"

  validate-openapi:
    name: Validate OpenAPI Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install swagger-cli
        run: npm install -g @apidevtools/swagger-cli

      - name: Validate openapi.yaml
        run: swagger-cli validate api/openapi.yaml

      - name: Validate ai-internal-api.yaml
        run: swagger-cli validate api/ai-internal-api.yaml

  validate-k8s-manifests:
    name: Validate K8s Manifests (kustomize + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl (kustomize 내장)
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.1'

      - name: Install kubeconform
        run: |
          # GitHub release 다운로드는 504 로 간헐 실패할 수 있어 Go install fallback 을 둔다.
          KUBECONFORM_VERSION=v0.7.0
          TMP_DIR="$(mktemp -d)"
          ARCHIVE="${TMP_DIR}/kubeconform.tar.gz"
          if curl -fsSL --retry 8 --retry-delay 2 --retry-max-time 300 --retry-all-errors \
            -o "${ARCHIVE}" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            && tar -xzf "${ARCHIVE}" -C "${TMP_DIR}" kubeconform; then
            install "${TMP_DIR}/kubeconform" /usr/local/bin/kubeconform
          else
            echo "::warning::kubeconform release download failed; falling back to go install"
            go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
            install "$(go env GOPATH)/bin/kubeconform" /usr/local/bin/kubeconform
          fi
          kubeconform -v

      - name: Reject unsafe Hibernate DDL modes in skala overlay
        run: |
          if grep -E 'SPRING_JPA_HIBERNATE_DDL_AUTO:\s*"(update|create|create-drop)"' \
            k8s/overlays/skala/patches/configmap-env.yaml; then
            echo "Unsafe SPRING_JPA_HIBERNATE_DDL_AUTO in skala ConfigMap patch"
            exit 1
          fi
          echo "skala DDL auto mode OK"

      - name: Build base + validate
        run: |
          kubectl kustomize k8s/base > /tmp/axis-base.yaml
          kubeconform -strict -summary /tmp/axis-base.yaml

      - name: Prepare secret.local.yaml (CI 용 placeholder)
        run: cp k8s/overlays/local/secret.local.yaml.example k8s/overlays/local/secret.local.yaml

      - name: Build overlays/local + validate
        run: |
          kubectl kustomize k8s/overlays/local > /tmp/axis-local.yaml
          kubeconform -strict -summary /tmp/axis-local.yaml

      - name: Build overlays/skala + validate
        run: |
          kubectl kustomize k8s/overlays/skala > /tmp/axis-skala.yaml
          kubeconform -strict -summary /tmp/axis-skala.yaml

  notify-spec-change:
    name: Notify API Spec Change
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for API spec changes
        id: check-changes
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'api/openapi.yaml' 'api/ai-internal-api.yaml')
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "files=$CHANGED" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment on spec change
        if: steps.check-changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const changedFiles = process.env.CHANGED_FILES.trim().split('\n');
            const fileList = changedFiles.map(f => `- \`${f}\``).join('\n');
            const body = [
              '## ⚠️ API 스펙 변경 감지',
              '',
              '다음 API 스펙 파일이 변경되었습니다:',
              fileList,
              '',
              '**각 레포에서 타입 자동 생성을 재실행해야 합니다:**',
              '',
              '**axis-frontend:**',
              '```bash',
              'npx openapi-typescript ../axis-infra/api/openapi.yaml -o src/types/api.ts',
              '```',
              '',
              '**axis-backend:**',
              '```bash',
              'openapi-generator-cli generate -i ../axis-infra/api/openapi.yaml -g spring -o ./generated',
              '```',
              '',
              '**axis-ai:**',
              '```bash',
              'datamodel-codegen --input ../axis-infra/api/ai-internal-api.yaml --output src/schemas.py',
              '```',
              '',
              '> 이 PR이 머지되기 전에 관련 레포 PR을 함께 준비해주세요.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
        env:
          CHANGED_FILES: ${{ steps.check-changes.outputs.files }}
