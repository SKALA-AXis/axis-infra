# Frontend — Harbor pullPolicy + imagePullSecrets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axis-frontend
  namespace: skala3-finalproj-class3-team13
spec:
  template:
    spec:
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: web          # base 의 container name 과 일치 (frontend X)
          imagePullPolicy: Always           # arch 변경 시 cache mismatch 방지
          securityContext:
            runAsUser: 0                    # nginx 가 chown /var/cache/nginx 위해 root 필요
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
            readOnlyRootFilesystem: false
