# Ingress SKALA 환경 patch — 공용 nginx + cert-manager HTTPS 로 전환 (team5/team6 패턴).
#
# 변경 (vs base, 그리고 이전 ALB-HTTP overlay 대비):
#   · ingressClass: alb → public-nginx        (공용 nginx Ingress Controller / 공용 ALB 뒤단)
#   · 전체 annotations 교체 → cert-manager.io/cluster-issuer: letsencrypt-prod 만
#       - ALB 전용 어노테이션(scheme/target-type/listen-ports/healthcheck/...) 전부 불필요
#       - cert-manager 가 HTTP-01 challenge 로 Let's Encrypt 인증서 자동 발급/갱신
#   · spec.tls 추가 → secretName: axis-tls-cert (cert-manager 가 생성/주입)
#   · host: axis-team13.skala25a.project.skala-ai.com (ingress-host.yaml 패치)
#
# 결과: https://axis-team13.skala25a.project.skala-ai.com 로 외부 접근(HTTPS).
#   path 라우팅(/api,/actuator,/swagger-ui,/api-docs → backend, / → frontend)은 base 그대로 유지.
#   HTTPS 라 refresh 쿠키 Secure=true(SameSite=Lax)가 정상 동작 → 로그인 세션 유지됨.
- op: replace
  path: /metadata/annotations
  value:
    cert-manager.io/cluster-issuer: letsencrypt-prod
- op: add
  path: /spec/ingressClassName
  value: public-nginx
- op: add
  path: /spec/tls
  value:
    - hosts:
        - axis-team13.skala25a.project.skala-ai.com
      secretName: axis-tls-cert
