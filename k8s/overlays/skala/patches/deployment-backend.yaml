# 작성자: 최종민
# 변경이력:
#   2026-05-08 최종민 — SKALA EKS in-namespace 배포 overlay에 backend 패치 추가
#   2026-05-12 최종민 — AWS SES 발송용 IRSA ServiceAccount(ses-mailer-sa)로 변경
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axis-backend
  namespace: skala3-finalproj-class3-team13
spec:
  template:
    spec:
      # AWS SES 발송 위해 IRSA-enabled SA (매니저 가이드). axis-backend-sa → ses-mailer-sa.
      # ses-mailer-sa 의 annotation eks.amazonaws.com/role-arn 이 SES 발송 IAM role 보유.
      serviceAccountName: ses-mailer-sa
      imagePullSecrets:
        - name: harbor-creds
      containers:
        - name: api          # base 의 container name 과 일치 (backend X)
          imagePullPolicy: Always           # arch 변경 시 cache mismatch 방지
