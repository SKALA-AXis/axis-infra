# axis-config — DATABASE_URL / Qdrant 를 SKALA 클러스터 공용 서비스 DNS 로 변경.
# Postgres / Qdrant 는 namespace 가 다르므로 FQDN 사용.
apiVersion: v1
kind: ConfigMap
metadata:
  name: axis-config
  namespace: skala3-finalproj-class3-team13
data:
  SPRING_PROFILES_ACTIVE: "prod"
  AI_SERVER_URL: "http://axis-ai:8001"
  AXIS_AUTH_ENFORCE: "true"
  # SKALA class/dev namespace 에서는 외부 이메일 가입 테스트를 허용한다.
  # * 는 새 backend wildcard 처리용이고, 뒤 도메인 목록은 기존 배포 이미지 호환용이다.
  # 실제 운영 오버레이는 sk.com 등 허용 도메인을 좁혀야 한다.
  AXIS_AUTH_ALLOWED_EMAIL_DOMAINS: "*,sk.com,gmail.com,naver.com,kakao.com,daum.net,hanmail.net,nate.com,outlook.com,hotmail.com,icloud.com"
  AXIS_AUTH_EMAIL_VERIFICATION_DELIVERY: "ses"
  # 이메일 인증 링크가 도착할 프론트 URL.
  # localhost 는 메일을 받은 다른 기기에서 열 수 없으므로 SKALA ALB 공개 주소를 사용한다.
  # axis.skala.ai DNS/TLS 가 확정되면 http://...elb.amazonaws.com 대신 공식 HTTPS URL 로 교체한다.
  AXIS_APP_BASE_URL: "http://skala3-team13-axis-alb-1349892737.ap-northeast-2.elb.amazonaws.com"

  # 임시 — Hibernate schema validation 스킵 (raw_articles.company jsonb vs entity varchar mismatch).
  # backend 팀이 RawArticle entity 를 jsonb 매핑으로 정정하면 'validate' 로 복원 권장.
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"

  # Qdrant — in-namespace (qdrant.yaml 의 Service "qdrant" 와 일치, 같은 ns 면 짧은 이름 OK)
  QDRANT_HOST: "http://qdrant"
  QDRANT_PORT: "6333"

  # 카드뉴스 이미지 PVC
  IMAGE_STORAGE_PATH: "/data/images"

  # 이메일 발송 — AWS SES V2 SDK + IRSA (ses-mailer-sa 의 IAM role).
  # axis-backend 의 SesMailService 가 SES API 직접 호출 (SMTP 폐기).
  # sender: noreply@skala-ai.com (매니저 SES verified domain).
  #
  # BRIEFING_RECIPIENTS 는 개인 이메일 (PII) 이라 ConfigMap (git tracked) 에 두지 않고
  # axis-secrets (env-to-skala-secret.sh 가 .env.skala 의 BRIEFING_RECIPIENTS 에서 생성) 로 주입.
  # backend Pod 의 envFrom 순서상 secretRef 가 configMapRef 보다 뒤라 동키 override 도 안전.
  AWS_REGION: "ap-northeast-2"
  MAIL_FROM: "noreply@skala-ai.com"
  BRIEFING_TIME: "08:30"

  # Spring @Scheduled 비활성화 — GitOps standard 인 CronJob (axis-cron-{delivery,ingestion-a/b/c/d})
  # 만 단일 trigger 사용. 과거 true 였을 때 backend 의 @Scheduled (sendDailyBriefing
  # @ "0 30 8 * * MON-FRI" Asia/Seoul + triggerIngestionPipeline @ "0 0 * * * *") 이
  # CronJob 과 *동시 trigger* 하여 일일 브리핑 이메일이 *2번* 발송되는 버그 (2026-05-15).
  # 해결: AXIS_SCHEDULER_ENABLED=false → SchedulerConfig 의 @ConditionalOnProperty 가
  # bean 등록 자체 skip. CronJob 만 남아 1번 발송.
  AXIS_SCHEDULER_ENABLED: "false"

  # 프론트 — 빌드타임 baked-in. 현재 Dockerfile 은 런타임 env 를 재주입하지 않지만,
  # 문서/향후 런타임 config 전환 시에도 실제 접근 가능한 ALB URL 을 기준값으로 둔다.
  VITE_API_BASE_URL: "http://skala3-team13-axis-alb-1349892737.ap-northeast-2.elb.amazonaws.com"
