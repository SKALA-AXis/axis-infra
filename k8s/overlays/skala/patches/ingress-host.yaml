# Ingress host — SKALA 공용 플랫폼 도메인으로 고정.
# *.skala25a.project.skala-ai.com 은 공용 nginx ALB 로 DNS 가 이미 잡혀 있고
# cert-manager(letsencrypt-prod)로 무료 TLS 인증서를 발급받는다. (도메인 구매 불필요)
# base 의 host(axis.skax.internal)를 실제 접근 가능한 공용 서브도메인으로 교체.
- op: replace
  path: /spec/rules/0/host
  value: axis-team13.skala25a.project.skala-ai.com
