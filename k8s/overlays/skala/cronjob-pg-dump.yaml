# 작성일: 2026-05-08
# 작성자: 최종민
# 변경이력:
#   2026-05-08 최종민 — SKALA EKS overlay 일부로 pg-dump CronJob 추가, 이후 스케줄 조정·DeadlineExceeded 대응·3단계 백업/S3(IRSA) 업로드·야간 셧다운 창 회피까지 반복 개선
# 매일 02:10 KST Postgres dump → 전용 PVC(axis-backup-pvc) + S3 (IRSA).
# axis-images(카드뉴스) 와 PVC 분리 + dump 단계는 EFS 미마운트(efs-csi stall 회피).
#
# 구조:
#   ① pg-dump (emptyDir only) — pg_dump + gzip, EFS 마운트 없음 → ContainerCreating stall 차단
#   ② efs-persist — 전용 PVC에 원자 복사 + retention
#   ③ s3-publish — IRSA 업로드
#
# hang 내성: Pod 900s × backoff 3 + restartPolicy Never (노드 재배치).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-pg-dump
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/part-of: axis
    app.kubernetes.io/component: backup
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  # 02:10 KST — ingestion-a(매시 :00) 직후 피크·05:40 구간 EFS stall 이력 회피.
  schedule: "30 21 * * *"  # 노드 야간 셧다운(23:00-07:00 KST) 회피 — docs/adr/0007 참조
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: axis
            app.kubernetes.io/component: backup
        spec:
          serviceAccountName: axis-backup-sa
          restartPolicy: Never
          activeDeadlineSeconds: 900
          initContainers:
            - name: pg-dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: axis-secrets
                      key: DATABASE_URL
                - name: PGCONNECT_TIMEOUT
                  value: "15"
                - name: PGOPTIONS
                  value: "-c lock_timeout=60000 -c statement_timeout=480000"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  set -o pipefail
                  ts() { date -u +%Y-%m-%dT%H:%M:%SZ; }
                  echo "[pg-dump $(ts)] started (no EFS mount — local stage only)"
                  STAMP=$(date -u +%Y%m%d_%H%M)
                  FILENAME="axis_team13_${STAMP}.sql.gz"
                  STAGE="/stage/${FILENAME}"
                  ERR="/stage/pgdump_${STAMP}.err"
                  rm -f "${STAGE}" "${ERR}"
                  echo "[pg-dump $(ts)] pg_dump → ${STAGE} START"
                  if pg_dump --no-owner --no-acl --verbose "${DATABASE_URL}" 2>"${ERR}" | gzip > "${STAGE}"; then
                    echo "[pg-dump $(ts)] pg_dump DONE size=$(du -h "${STAGE}" | cut -f1)"
                  else
                    echo "[pg-dump $(ts)] pg_dump FAILED — last 25 stderr lines:"
                    tail -25 "${ERR}" || true
                    exit 1
                  fi
                  echo "[pg-dump $(ts)] gzip -t (verify) ..."
                  gzip -t "${STAGE}"
                  printf 'FILENAME=%s\n' "${FILENAME}" > /work/meta.env
                  echo "[pg-dump $(ts)] DONE (stage ready for EFS persist)"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "200m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
              volumeMounts:
                - name: stage
                  mountPath: /stage
                - name: work
                  mountPath: /work
            - name: efs-persist
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ts() { date -u +%Y-%m-%dT%H:%M:%SZ; }
                  . /work/meta.env
                  OUT="/data/backups/${FILENAME}"
                  TMP="${OUT}.tmp"
                  STAGE="/stage/${FILENAME}"
                  echo "[efs-persist $(ts)] EFS mount OK — persist ${FILENAME}"
                  if [ ! -f "${STAGE}" ]; then
                    echo "[efs-persist $(ts)] ERROR missing stage file ${STAGE}:"
                    ls -la /stage/ || true
                    exit 1
                  fi
                  timeout 60 mkdir -p /data/backups
                  timeout 300 cp "${STAGE}" "${TMP}"
                  timeout 60 mv "${TMP}" "${OUT}"
                  echo "[efs-persist $(ts)] persisted size=$(du -h "${OUT}" | cut -f1)"
                  timeout 120 find /data/backups -type f -name '*.sql.gz' -mtime +14 -delete || true
                  timeout 120 find /data/backups -type f -name '*.tmp' -mtime +1 -delete || true
                  echo "[efs-persist $(ts)] DONE"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
              volumeMounts:
                - name: backup-volume
                  mountPath: /data
                - name: stage
                  mountPath: /stage
                  readOnly: true
                - name: work
                  mountPath: /work
                  readOnly: true
          containers:
            - name: s3-publish
              image: amazon/aws-cli:2.15.30
              imagePullPolicy: IfNotPresent
              env:
                - name: AWS_DEFAULT_REGION
                  value: ap-northeast-2
                - name: BACKUP_S3_BUCKET
                  value: axis-team13-backups
                - name: BACKUP_S3_PREFIX
                  value: pg
              command:
                - /bin/sh
                - -ec
                - |
                  set -eu
                  . /work/meta.env
                  SRC="/data/backups/${FILENAME}"
                  S3_URI="s3://${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}/${FILENAME}"
                  test -f "${SRC}"
                  echo "[s3-publish] uploading ${SRC} → ${S3_URI}"
                  aws s3 cp "${SRC}" "${S3_URI}" --only-show-errors --sse AES256
                  aws s3 ls "${S3_URI}" >/dev/null
                  echo "[s3-publish] verified ${S3_URI}"
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
              volumeMounts:
                - name: backup-volume
                  mountPath: /data
                  readOnly: true
                - name: work
                  mountPath: /work
                  readOnly: true
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: axis-backup-pvc
            - name: stage
              emptyDir:
                sizeLimit: 2Gi
            - name: work
              emptyDir: {}
