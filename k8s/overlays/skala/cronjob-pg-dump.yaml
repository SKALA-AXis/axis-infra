# 매일 05:00 KST(UTC 20:00) Postgres 전체 dump → axis-images PVC 의 /data/backups
# SKALA 클러스터가 wipe 되어도 PVC 살아있는 동안 복구 가능.
# 별도 S3 export 는 추후 추가 (sealed-secret 으로 AWS creds 주입 후).
#
# 시간대 선정:
#   · 02:00 KST: axis-cron-ingestion-a (매시 정각) 과 겹쳐 pg_dump 가 consistent
#     snapshot 잡고 5h hang 후 fail.
#   · 03:00 KST: ingestion-a 정시 trigger 와 같은 분 시작 → lock race 30분 fail.
#   · 03:15 KST(UTC 18:15): ingestion-a 와는 분리됐지만 axis-cron-ingestion-b-close
#     (UTC 18:00, 평일) 의 track B async tail (axis-ai 가 crawl+LLM+카드생성으로
#     수십 분간 DB + 공유 PVC axis-images 무겁게 write) 과 겹쳐 dump 의 gzip write
#     가 throttle → 30분 deadline 초과 fail 재발 (2026-05-27, 05-28 평일 연속).
#   · 05:00 KST(UTC 20:00): hourly ingestion-a (12초) 외에 도는 batch 가 없는
#     조용한 창. ingestion-b-close async tail 과 완전히 분리. 수동 off-peak run
#     이 2.5분에 안정 완료됨을 확인 (2026-05-29).
#   · activeDeadlineSeconds 는 30분 → 60분 으로 상향. 만일의 경합에도 fail 대신
#     완주할 여유를 주되, 과거 5h hang 같은 무한 대기는 차단하는 fail-fast 유지.
#
# 2026-06-01 재발 진단 — DeadlineExceeded 의 진짜 원인:
#   gzip 출력을 공유 EFS(NFS) PVC 로 곧장 stream write 하면, EFS writeback 이
#   느려질 때 dirty page 가 cgroup 메모리 한도(512Mi)까지 쌓이고, 프로세스가
#   NFS writeback 대기(D-state, uninterruptible)에 걸려 SIGKILL 도 안 먹고 멈춤
#   → 60분 deadline 까지 hang. EFS writeback 이 빠른 날엔 통과(05-26/27), 경합이
#   조금만 생겨도 한도 초과로 hang(05-29~31). pg_dump→/dev/null 은 2분, 동일 덤프
#   를 512Mi 로 EFS write 시 OOM(exit137), 2Gi 로는 1m15s 완주됨을 측정 확인.
# 해결: ① 덤프를 로컬 emptyDir(노드 디스크, 빠른 writeback)로 먼저 쓰고 검증 후
#       EFS 로 한 번에 복사 → NFS writeback hang 원천 차단.
#       ② 메모리 512Mi→1Gi, CPU 500m→1 상향(gzip CPU-bound, 완주시간 단축).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-pg-dump
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/part-of: axis
    app.kubernetes.io/component: backup
spec:
  # KST 05:00 = UTC 20:00 (전날). 클러스터 timezone 이 UTC.
  schedule: "0 20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # 1.1GB DB 가 정상 환경에서 ~2.5분에 dump 완료 (검증됨, 2026-05-29).
      # 경합 시에도 완주하도록 60분 여유. 그 이상 hang 시 hard timeout 으로
      # 자르고 cron 다음 cycle 에 재시도.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: axis
            app.kubernetes.io/component: backup       # NetworkPolicy allow-postgres-from-app 매칭
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: axis-secrets
                      key: DATABASE_URL
              command:
                - /bin/sh
                - -c
                - |
                  # pipefail: pg_dump 가 중간 실패해도 gzip 의 exit 0 에 묻히지 않게.
                  # busybox ash (postgres:16-alpine) 는 pipefail 지원.
                  set -eu
                  set -o pipefail
                  STAMP=$(date -u +%Y%m%d_%H%M)
                  OUT="/data/backups/axis_team13_${STAMP}.sql.gz"
                  TMP="${OUT}.tmp"
                  STAGE="/stage/axis_team13_${STAMP}.sql.gz"
                  mkdir -p /data/backups
                  rm -f "${TMP}" "${STAGE}"
                  # 실패/중단 시 로컬 stage + EFS tmp 잔여 자동 정리
                  trap 'rm -f "${STAGE}" "${TMP}"' EXIT
                  echo "[pg-dump] dumping → ${STAGE} (local stage)"
                  # ① 로컬 emptyDir 로 먼저 dump (EFS NFS writeback 경합 / dirty-page
                  #    메모리 hang 을 원천 차단 — DB read 가 노드 디스크 속도로 진행),
                  # ② gzip 무결성 검증, ③ 통과 시 EFS 로 원자적 복사(.tmp → mv).
                  pg_dump --no-owner --no-acl "${DATABASE_URL}" | gzip > "${STAGE}"
                  gzip -t "${STAGE}"
                  cp "${STAGE}" "${TMP}"
                  mv "${TMP}" "${OUT}"
                  rm -f "${STAGE}"
                  echo "[pg-dump] size: $(du -h "${OUT}" | cut -f1)"
                  # 14일 이전 dump 삭제 — PVC 용량 보호
                  find /data/backups -type f -name '*.sql.gz' -mtime +14 -delete
                  # 잔여 tmp (>1d) 청소 — 이전 실패 run 의 흔적까지 회수
                  find /data/backups -type f -name '*.tmp' -mtime +1 -delete
                  echo "[pg-dump] retention applied (>14d sql.gz, >1d tmp removed)"
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "200m"
                limits:
                  # 512Mi 는 gzip→EFS dirty-page 누적 시 OOM/NFS hang → DeadlineExceeded.
                  # 1Gi 로 충분한 여유 확보(덤프 출력 ~280MB). gzip 은 CPU-bound 라
                  # CPU 1 로 올려 완주시간 단축(500m→1 시 2.5분→~1.3분).
                  memory: "1Gi"
                  cpu: "1"
              volumeMounts:
                - name: backup-volume
                  mountPath: /data
                - name: stage          # 로컬 노드 디스크 — gzip 임시 출력(EFS NFS hang 회피)
                  mountPath: /stage
          volumes:
            - name: backup-volume
              persistentVolumeClaim:
                claimName: axis-images   # 기존 PVC 재사용 (/data/images 와 형제 디렉토리)
            - name: stage
              emptyDir:
                sizeLimit: 2Gi           # 압축 덤프(~280MB) 스테이징용. 노드 ephemeral storage.
