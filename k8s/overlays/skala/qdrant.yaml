# 작성일: 2026-05-08
# 작성자: 최종민
# 변경이력:
#   2026-05-08 최종민 — SKALA EKS in-namespace 배포 overlay에 Qdrant 추가
#   2026-05-11 최종민 — ArgoCD GitOps 도입에 맞춘 변경
#   2026-06-08 박진 — Qdrant 런타임 업그레이드
#   2026-06-09 최종민 — PVC segment 포맷 비호환 회피로 이미지 v1.9.4 고정
#   2026-06-12 최종민 — namespace CPU request 적정화(surge 포드 Pending 해소)
# SKALA EKS overlay — namespace 내부 Qdrant.
# StorageClass: gp3 (SKALA 클러스터 default).
# 데이터 보존: PVC qdrant-data (5Gi). 임베딩 재생성 비용 큼 → 백업 권장.
#
# 버전 정책: PVC segment 포맷이 major 간 비호환 (v1.9 → v1.18 업그레이드 시
#   on_disk vs mmap 역직렬화 panic). 무중단 major bump 금지 — snapshot export/import
#   또는 컬렉션 재적재 전까지 이미지 pin 유지.
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: skala3-finalproj-class3-team13
  labels:
    app: qdrant
    tier: data
    app.kubernetes.io/part-of: axis
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: skala3-finalproj-class3-team13
  annotations:
    # ArgoCD 가 manifest 에서 빠져도 PVC 는 prune 하지 않음 (벡터 인덱스 재생성 비용 큼).
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app: qdrant
    app.kubernetes.io/part-of: axis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: skala3-finalproj-class3-team13
  labels:
    app: qdrant
    tier: data
    app.kubernetes.io/part-of: axis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        tier: data
        app.kubernetes.io/part-of: axis
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.9.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          resources:
            requests:
              # 100m — 실사용 1~3m (2026-06-12). burst 는 limit 으로 보장.
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: qdrant-data
