# SKALA EKS overlay — class3-team13
#
# 대상 환경:
#   클러스터:   skala-2025 (EKS, ap-northeast-2)
#   namespace: skala3-finalproj-class3-team13
#   레지스트리: amdp-registry.skala-ai.com (Harbor) / project=skala26a-ai3
#   Postgres:  postgres-1-postgresql.postgres.svc.cluster.local:5432  (cluster 공용)
#   Qdrant:    qdrant.qdrant.svc.cluster.local:6333                    (cluster 공용)
#
# base 와의 차이:
#   · 이미지: REPLACE_ACCOUNT (ECR 가정) → Harbor (amdp-registry.skala-ai.com/skala26a-ai3)
#   · pullPolicy: IfNotPresent  +  imagePullSecrets: harbor-creds
#   · DATABASE_URL / QDRANT_URL: cluster 공용 서비스 DNS (configmap-env.yaml)
#   · CronJob: pg_dump 백업 추가
#   · NetworkPolicy / HPA / Ingress: 활성화 (EKS 는 지원)
#
# 사용:
#   1) cp secret.skala.yaml.example secret.skala.yaml — 매니저 받은 실값 채움 (.gitignore)
#   2) docker login amdp-registry.skala-ai.com  +  이미지 build/push (Makefile)
#   3) kubectl create secret docker-registry harbor-creds ... (1회)
#   4) kubectl apply -k k8s/overlays/skala
#
# 자세한 절차: README.md 참조.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skala3-finalproj-class3-team13

  # secret.skala.yaml — gitignored 라 ArgoCD 가 빌드 불가. 클러스터에 직접 1회 apply
  # (make skala-secret + kubectl apply). axis-application.yaml 의 ignoreDifferences 로 diff 무시.
resources:
- ../../base
- postgres.yaml
- qdrant.yaml
- cronjob-pg-dump.yaml
- networkpolicy-db.yaml
- service-aliases.yaml

# 이미지 치환 — Harbor 로
images:
- name: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-ai
  newName: amdp-registry.skala-ai.com/skala26a-ai3/axis-ai
  newTag: a410a67
- name: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-backend
  newName: amdp-registry.skala-ai.com/skala26a-ai3/axis-backend
  newTag: 104ccc2
- name: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-frontend
  newName: amdp-registry.skala-ai.com/skala26a-ai3/axis-frontend
  newTag: 416deea

  # ── pullPolicy + imagePullSecrets (3 Deployment)

  # ── ConfigMap 환경 — DB / Qdrant URL 을 cluster 내부 DNS 로

  # ── Ingress host 제거 (team12 패턴 — wildcard, ALB 자동 DNS) (JSON 6902)

  # ── Ingress SKALA 환경 어노테이션 + ingressClassName: alb

  # ── PVC axis-images storageClass: REPLACE_RWX_* → efs-sc-shared (SKALA EFS RWX)
patches:
- path: patches/deployment-frontend.yaml
- path: patches/deployment-backend.yaml
- path: patches/deployment-ai.yaml
- path: patches/configmap-env.yaml
- path: patches/ingress-host.yaml
  target:
    group: networking.k8s.io
    kind: Ingress
    name: axis
    version: v1
- path: patches/ingress-skala.yaml
  target:
    group: networking.k8s.io
    kind: Ingress
    name: axis
    version: v1
- path: patches/pvc-images.yaml
  target:
    kind: PersistentVolumeClaim
    name: axis-images
