# 작성일: 2026-05-04
# 작성자: 최종민
# 변경이력:
#   2026-05-04 최종민 — 로컬용 in-cluster Qdrant 매니페스트 추가, namespace 단일화 및 이미지 v1.9.4 핀 고정
#   2026-06-08 박진 — Qdrant 이미지 런타임 업그레이드(v1.18.0)
# 옵션 — in-cluster Qdrant.
# kustomization.yaml 의 resources 에서 주석 해제 후 사용.
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: skala3-finalproj-class3-team13
  labels:
    app: qdrant
    tier: data
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: skala3-finalproj-class3-team13
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: skala3-finalproj-class3-team13
  labels:
    app: qdrant
    tier: data
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        tier: data
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.9.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: qdrant-data
