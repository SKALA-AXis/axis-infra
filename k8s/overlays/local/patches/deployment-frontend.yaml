# 작성자: 최종민
# 변경이력:
#   2026-05-04 최종민 — 로컬 overlay용 axis-frontend Deployment 패치 추가 및 namespace를 공유 클러스터 단일 namespace로 적용
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axis-frontend
  namespace: skala3-finalproj-class3-team13
spec:
  replicas: 1  # 로컬 단일 노드 — 1개로 충분
  template:
    spec:
      containers:
        - name: web
          image: axis-frontend:dev
          imagePullPolicy: Never  # 로컬 빌드 이미지만 사용
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
