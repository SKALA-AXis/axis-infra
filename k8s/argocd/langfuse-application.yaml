# ArgoCD Application — Langfuse v2 self-host (team13 namespace).
#
# axis-team13 Application 과 분리된 별도 Application — Langfuse 는 외부 chart
# (langfuse/langfuse-k8s) 를 source 로 하고 우리 git 의 values.yaml 을 override.
#
# 사전 조건:
#   1) helm/langfuse/values.yaml 파일 존재 (이 PR 에 포함)
#   2) k8s/base/langfuse-secret.yaml 가 cluster 에 적용되어 있음
#      (NEXTAUTH_SECRET / SALT / POSTGRES_PASSWORD 채운 상태)
#   3) 매니저에게 ingress host (langfuse.skala25a.project.skala-ai.com) 등록 신청 완료
#
# 적용:
#   kubectl apply -f k8s/argocd/langfuse-application.yaml
#
# 검증:
#   kubectl get applications.argoproj.io -n skala-argocd langfuse \
#     -o jsonpath='{.status.sync.status} {.status.health.status}{"\n"}'
#   # 기대: Synced Healthy (initial provisioning ~3분)
#
# 운영 spec: docs/OBSERVABILITY_LANGFUSE.md

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: skala-argocd
  labels:
    team: team13
    app.kubernetes.io/part-of: axis
    app.kubernetes.io/component: observability
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # 1) 외부 Helm chart (Langfuse 공식)
    - repoURL: https://langfuse.github.io/langfuse-k8s
      chart: langfuse
      # v2 마지막 호환 chart. helm repo update 후 정확한 버전 확인 필요.
      # 0.11.x 부터 v3 only — bump 시 v2 → v3 마이그레이션 plan (PVC quota) 동반.
      targetRevision: 0.10.0
      helm:
        # values 는 우리 git 의 helm/langfuse/values.yaml 와 동등. ArgoCD 가 chart 와
        # 함께 적용하기 위해 inline valuesObject 로 표현 (multi-source 패턴 회피해 단순화).
        valuesObject:
          image:
            tag: "2.94"
          postgresql:
            enabled: true
            image:
              # Bitnami 2024-08 secure-images 정책 — bitnamilegacy mirror 사용
              registry: docker.io
              repository: bitnamilegacy/postgresql
            auth:
              username: langfuse
              database: langfuse
              existingSecret: langfuse-postgresql
              secretKeys:
                adminPasswordKey: postgres-password
                userPasswordKey: password
            primary:
              persistence:
                enabled: true
                size: 5Gi
                storageClass: gp3
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { cpu: 500m, memory: 1Gi }
          # v2 blob storage 비활성 — 우리 안 씀 + Bitnami image 정책 영향 + PVC 절약
          minio:
            enabled: false
          # 명시적 비활성 (chart default 지만 안전 차원)
          clickhouse:
            enabled: false
          redis:
            enabled: false
          auth:
            signupDisabled: true
          extraEnv:
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: NEXTAUTH_URL
              value: https://langfuse.skala25a.project.skala-ai.com
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: NEXTAUTH_SECRET
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: langfuse-secret
                  key: SALT
          ingress:
            enabled: true
            className: public-nginx
            annotations:
              nginx.ingress.kubernetes.io/proxy-body-size: "16m"
            hosts:
              - host: langfuse.skala25a.project.skala-ai.com
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - hosts:
                  - langfuse.skala25a.project.skala-ai.com
          resources:
            limits:   { cpu: 2, memory: 4Gi }
            requests: { cpu: 500m, memory: 1Gi }
          worker:
            enabled: true
            replicas: 1
            resources:
              limits:   { cpu: 1, memory: 2Gi }
              requests: { cpu: 200m, memory: 512Mi }

  destination:
    server: https://kubernetes.default.svc
    namespace: skala3-finalproj-class3-team13

  syncPolicy:
    automated:
      selfHeal: false           # 초기 안정화 전까지 false (axis-team13 와 동일 정책)
      prune: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false   # team13 namespace 는 이미 존재
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  # 외부 관리 필드 — ArgoCD 의 drift 판정에서 제외
  ignoreDifferences:
    # 우리가 kubectl apply 로 직접 관리하는 secret 2종 (env-to-langfuse-secret.sh 생성)
    - group: ""
      kind: Secret
      name: langfuse-postgresql
      jsonPointers:
        - /stringData
        - /data
    - group: ""
      kind: Secret
      name: langfuse-secret
      jsonPointers:
        - /stringData
        - /data
