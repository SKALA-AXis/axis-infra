# 작성일: 2026-05-04
# 작성자: 최종민
# 변경이력:
#   2026-05-04 최종민 — kustomize base(EKS) 매니페스트에 axis-config ConfigMap 추가
#   2026-05-21 박진 — 로그인/회원가입 관련 설정 추가 및 로직 개선
#   2026-06-11 박지원 — LLM 뉴스 클러스터 postprocess cron 활성화 설정
# axis-config — 비밀이 아닌 설정만. 자격증명은 secret.yaml 참조.
# 값에 placeholder 가 있으면 환경별 overlay 또는 실 배포 전에 치환.
apiVersion: v1
kind: ConfigMap
metadata:
  name: axis-config
  namespace: skala3-finalproj-class3-team13
data:
  # ── backend (Spring Boot)
  SPRING_PROFILES_ACTIVE: "prod"
  AI_SERVER_URL: "http://axis-ai:8001"
  AXIS_AUTH_ENFORCE: "true"
  AXIS_AUTH_EMAIL_VERIFICATION_DELIVERY: "ses"
  AXIS_APP_BASE_URL: "https://axis.skax.internal"

  # ── ai (FastAPI / LangGraph) — Qdrant Cloud
  # 실제 URL 은 환경별 overlay 또는 secret 으로 옮길지 결정 필요.
  QDRANT_HOST: "https://REPLACE_QDRANT_CLUSTER_ID.qdrant.io"
  QDRANT_PORT: "6333"
  AXIS_AI_LOG_LEVEL: "INFO"
  # 참고: ai 의 listen 포트는 Dockerfile 의 --port 8001 하드코드.
  # 향후 코드가 환경변수로 받게 되면 AI_SERVER_PORT 키 추가.

  # ── LLM-assisted AI pipeline
  ENABLE_OPENAI_CALLS: "true"
  ENABLE_RELEVANCE_LLM: "false"
  POSTPROCESS_TITLE_LLM_JUDGE_ENABLED: "false"

  # ── premium LLM 경로 모델: gpt-4o 통일 (2026-06-18 비용 절감 — gpt-5.5/5.4 대신 4o).
  # briefing(메일 본문)·today-insight·mixer-deep 는 호출 빈도가 낮아도 gpt-5 계열은 비싸,
  # 가성비 위해 premium 경로도 gpt-4o 로 하향. 코드 기본: briefing=gpt-4o /
  # today-insight·mixer-deep=gpt-5.5 → 여기서 셋 다 gpt-4o 로 명시 하향.
  # cronjob-briefing-generate(curl→동일 API)·on-demand 모두 ai-deployment 포드라 본 ConfigMap 하나로 적용.
  BRIEFING_LLM_MODEL: "gpt-4o"
  TODAY_INSIGHT_MODEL: "gpt-4o"
  MIXER_DEEP_LLM_MODEL: "gpt-4o"

  # ── 카드 뉴스 이미지 공유 볼륨
  IMAGE_STORAGE_PATH: "/data/images"

  # ── 메일 발송 — AWS SES V2 SDK + IRSA (backend 의 SesMailService 가 발송 주체).
  # 발송 SMTP 폐기 (Resend / SendGrid 시점 잔재 제거). backend Pod 의 ses-mailer-sa 가
  # IAM role 통한 SES API 직접 호출. SMTP_HOST/PORT/USER/PASSWORD 환경변수 모두 불필요.
  # 환경별 overlay 에서 AWS_REGION + MAIL_FROM 박음 (overlays/skala/patches/configmap-env.yaml).
  #
  # BRIEFING_RECIPIENTS 는 개인 이메일 (PII) — public repo 전환 시 노출 방지 위해
  # ConfigMap 이 아닌 axis-secrets 로만 주입 (scripts/env-to-skala-secret.sh 의 OTHER_KEYS).
  BRIEFING_TIME: "08:30"

  # ── frontend (Vite — 빌드타임 baked-in)
  # 본 ConfigMap 의 VITE_API_BASE_URL 은 빌드 인자로만 사용 (런타임 주입 X).
  # D12 결정 후 런타임 config.js 패턴 도입 시 의미 변경.
  VITE_API_BASE_URL: "https://axis.skax.internal"
