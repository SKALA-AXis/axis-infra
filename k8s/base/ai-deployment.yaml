# 작성일: 2026-05-04
# 작성자: 최종민
# 변경이력:
#   2026-05-04 최종민 — kustomize base에 axis-ai Deployment 추가 및 단일 namespace 적용, BGE-M3 메모리·프로브 조정, PVC 모델 캐시·initContainer 워밍, zero-downtime 롤아웃과 ns CPU request 적정화
# axis-ai Deployment.
#   · 메모리 집약 (BGE-M3 ~2Gi + Reranker ~1Gi + 워킹셋)
#   · 절대 ×2 금지 — 같은 PVC 에 동시 write 시 race condition 위험 + 메모리 비용
#   · HPA 미사용 — 콜드스타트 1~3분 (BGE-M3 모델 다운로드)
#   · maxSurge=0 으로 동시 2 Pod 실행 회피
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axis-ai
  namespace: skala3-finalproj-class3-team13
  labels:
    app: axis-ai
    tier: business
    app.kubernetes.io/part-of: axis
spec:
  replicas: 1
  # 새 포드가 Ready 를 90초 유지해야 available 로 인정 → 그 전까지 구포드 유지.
  # minReadySeconds 없이는 '순간 Ready' 직후 구포드가 죽고, 새 포드가 초기 부하로
  # readiness 플랩하면 단일 replica 엔드포인트가 비어 AI 전면 순단 (2026-06-11 실측 4분31초).
  # 180s: 실측 플랩 시작이 첫 Ready +84초였음 — 90s 는 마진이 한 장 차이라 2배수로.
  minReadySeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # model-cache 가 RWX PVC(axis-models)로 영속화되어 동시 기동 race 사유 소멸.
      # surge=1/unavailable=0: 새 포드가 Ready 될 때까지 구포드 유지 — 클러스터
      # request 포화로 새 포드가 Pending 이어도 서비스 무중단 (2026-06-11 다운 사고 재발 방지).
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: axis-ai
  template:
    metadata:
      labels:
        app: axis-ai
        tier: business
        app.kubernetes.io/part-of: axis
    spec:
      serviceAccountName: axis-ai-sa
      # 모델 워밍업 — BGE-M3/Reranker 를 PVC 캐시에 미리 받아둠.
      # initContainer 는 probe 대상이 아니므로 EFS 첫 다운로드가 아무리 느려도
      # startupProbe 재시작 루프가 생기지 않음 (2026-06-10: 13분 예산도 2회 소진한 실측 후 도입).
      # snapshot_download 는 idempotent — 캐시 적중 시 수 초 내 통과.
      initContainers:
        - name: model-warmup
          image: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-ai:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              from huggingface_hub import snapshot_download
              for repo in ("BAAI/bge-m3", "BAAI/bge-reranker-v2-m3"):
                  print(f"warmup: {repo}", flush=True)
                  snapshot_download(repo)
              print("warmup: done", flush=True)
          resources:
            requests:
              # 200m — main 컨테이너 request 와 정렬 (pod 유효 CPU request = max(init, main)
              # 이라 init 이 더 크면 그 값이 스케줄링 바인딩이 됨).
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              # 4Gi — EFS(NFS) 쓰기의 dirty page cache 가 cgroup 메모리에 잡혀
              # 2Gi 에서 다운로드 중 OOMKilled (2026-06-10 실측, exit 137).
              # init 은 main(5Gi req) 시작 전에 끝나므로 pod 유효 요청량 영향 없음.
              memory: 4Gi
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
      containers:
        - name: ai
          image: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-ai:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: axis-config
            - secretRef:
                name: axis-secrets
          resources:
            requests:
              # 200m — 노드별 request 여유가 40~260m 까지 떨어진 포화 상태(2026-06-12 실측,
              # ns 합산 26.3/23 cores 오버커밋)에서 400m surge 포드가 25분+ Pending.
              # 실사용 한 자릿수 m (idle 2m) 로 경합 위험 낮고, burst 는 limit 2000m 로 보장.
              # 시동기 모델 로드가 경합으로 느려져도 startupProbe(failureThreshold 150)가 흡수.
              cpu: 200m
              # 4Gi — 모델 로드 후 실측 2.2Gi + 1.8Gi 마진 (BGE-M3 fp16 ~1.2Gi + heap + pool).
              memory: 4Gi
            limits:
              cpu: 2000m
              # ingestion cycle 중 BGE-M3 encode (max_length=2048, batch=8) 의
              # attention matrix spike 대비 safety margin. node capacity 16Gi 중
              # 다른 pod 합산 ~5Gi 이므로 8Gi 여유 있음.
              memory: 8Gi
          # Probe 는 경량 /healthz (DB/Qdrant query 없음) 사용. /health 는 상세 진단용.
          # ingestion 등 CPU-bound 작업이 잠시 event loop 를 막아도 SIGKILL 안 되도록
          # timeoutSeconds 10, failureThreshold 완화. axis-ai PR #72/#73 의 to_thread
          # 적용으로 평상시 응답은 즉시 (~1ms).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            # 약 13분 — 앱이 startup hook 에서 모델 다운로드를 마쳐야 포트를 열기 때문에
            # PVC(EFS) 첫 다운로드(~3.4GB)가 통째로 이 예산 안에 들어옴.
            # 60(5분)으로는 EFS 첫 기동에서 재시작 루프 발생 (2026-06-10 실측).
            # 캐시 적중 시(두 번째 기동부터)는 1~2분 내 통과.
            failureThreshold: 150
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            # liveness 와 동일하게 10s — CPU-bound 작업(ingestion)이 이벤트 루프를
            # 잠시 막을 때 5s 타임아웃으로 readiness 가 플랩하던 비대칭 해소.
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: axis-images
              mountPath: /data/images
              # ai 는 이미지 write 권한 필요 (read-only X)
            - name: model-cache
              mountPath: /root/.cache/huggingface
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false  # 모델 다운로드·임시 파일
      volumes:
        - name: axis-images
          persistentVolumeClaim:
            claimName: axis-images
            # ai 는 read-only X
        - name: model-cache
          # BGE-M3 + Reranker 모델 캐시 — PVC 영속화 (axis-models-pvc.yaml).
          # 노드가 매일 재생성되는 환경(ADR 0007)에서 emptyDir 는 매 아침 ~3.4GB
          # HF 재다운로드를 유발했음. 첫 기동 시 1회만 다운로드 후 재사용.
          persistentVolumeClaim:
            claimName: axis-models
