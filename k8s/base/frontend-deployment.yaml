# 작성일: 2026-05-04
# 작성자: 최종민
# 변경이력:
#   2026-05-04 최종민 — frontend Deployment 최초 작성(kustomize base), 단일 namespace 적용 후 non-root(UID 101) 구성 보강
# axis-frontend Deployment.
#   · 컨테이너 포트 3000 (nginx.conf 의 listen 3000 과 일치)
#   · VITE_API_BASE_URL 은 빌드타임 baked-in — D12 결정 후 런타임 패턴으로 전환 가능
#   · 정적 SPA 라 가벼움
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axis-frontend
  namespace: skala3-finalproj-class3-team13
  labels:
    app: axis-frontend
    tier: presentation
    app.kubernetes.io/part-of: axis
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: axis-frontend
  template:
    metadata:
      labels:
        app: axis-frontend
        tier: presentation
        app.kubernetes.io/part-of: axis
    spec:
      serviceAccountName: axis-frontend-sa
      # nginx:alpine 의 nginx 사용자(UID 101). emptyDir 로 cache/run 쓰기.
      securityContext:
        runAsUser: 101
        runAsNonRoot: true
        fsGroup: 101
      containers:
        - name: web
          image: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-frontend:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # VITE_API_BASE_URL 은 빌드 시 baked. 런타임 주입 의미 X — 문서화 목적으로만 ConfigMap 참조.
          env:
            - name: VITE_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: axis-config
                  key: VITE_API_BASE_URL
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
            runAsUser: 101
            runAsNonRoot: true
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
