# 작성일: 2026-05-04
# 작성자: 최종민
# 변경이력:
#   2026-05-04 최종민 — kustomize base 인덱스 최초 작성 및 워크로드/CronJob/PVC/데모 뉴스룸 등 리소스 지속 등록·정리
#   2026-05-12 박지원 — track 관련 리소스 수정 및 cronjob 정리(은퇴 capability-evolution cron 제거)
#   2026-06-12 박진 — 목업 삭제에 따른 리소스 정리
#   2026-06-15 안가은 — datalab 신선도 위해 track D 수집 지연 반영
# axis-infra/k8s/base — 모든 리소스 단일 인덱스.
#
# 사용법:
#   1) `cp secret.example.yaml secret.yaml` 후 실값 채움.
#   2) overlay 또는 본 base 직접 사용:
#        kubectl apply -k k8s/base
#   3) PLACEHOLDER 검증: 매니페스트 안 REPLACE_* 가 모두 치환됐는지 확인.
#
# 환경별 overlay (staging / prod) 는 후속 단계 — 본 base 만 v0 에서 작성.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skala3-finalproj-class3-team13

labels:
  - pairs:
      app.kubernetes.io/part-of: axis
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false  # selector 변형 방지 (Deployment selector 와 mismatch 방지)

resources:
  # 네임스페이스 + 한도
  - namespace.yaml
  # ServiceAccount
  - serviceaccounts.yaml
  # 설정
  - configmap.yaml
  # 자격증명 (axis-secrets) 은 본 base 의 resources 에 포함하지 않는다.
  # 이유: overlay 가 환경별로 다른 Secret 을 추가할 때 ID 충돌이 발생.
  # 운영 절차:
  #   · cloud:  cp secret.example.yaml secret.yaml → 실값 채움 → kubectl apply -f secret.yaml
  #   · local:  overlays/local/secret.local.yaml (overlay 의 resources 에서 추가)
  #   · 운영:   ExternalSecret CRD 로 교체 (D14=c)
  # 즉 secret.example.yaml 은 템플릿일 뿐, 직접 적용되지 않는다.
  # 스토리지
  - axis-images-pvc.yaml
  - axis-models-pvc.yaml
  # 워크로드
  - frontend-deployment.yaml
  - frontend-service.yaml
  - hpa-frontend.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - hpa-backend.yaml
  - ai-deployment.yaml
  - ai-service.yaml
  # 시연용 데모 뉴스룸 (정적 페이지 — 발표 시 "중요 뉴스 게시 → 이메일 알림" 시연)
  - demo-newsroom-deployment.yaml
  - demo-newsroom-service.yaml
  # 외부 진입
  - ingress.yaml
  # 보안
  - networkpolicy.yaml
  # 가용성 — drain 시 최소 replica 유지
  - pdb-backend.yaml
  - pdb-frontend.yaml
  - pdb-ai.yaml
  # 스케줄러
  - cronjob-ingestion-a.yaml
  - cronjob-ingestion-b.yaml
  - cronjob-ingestion-c.yaml
  - cronjob-ingestion-d.yaml
  - cronjob-naver-datalab-late.yaml
  - cronjob-delivery.yaml
  # 화면용 Daily/Weekly/Monthly briefing 사전 생성 (briefing_reports 저장). delivery(이메일)와 별개.
  - cronjob-briefing-generate.yaml
  - cronjob-today-insight.yaml
  - cronjob-weak-signal.yaml
  # axis-ai 1단계 분석 supervisor 의 context layer CronJob.
  - cronjob-profile-refresh.yaml
  - cronjob-weekly-digest.yaml
  - cronjob-sector-pulse.yaml
  - cronjob-news-cluster-postprocess.yaml
  # 글로벌 IT 트렌드 + peer alignment (design: axis-ai/design/30-analysis/global-trends.md).
  - cronjob-global-trend.yaml
  # CronJob 실패 → Slack 알림 (watcher + RBAC).
  - cronjob-failure-notifier.yaml
  # 대형 이벤트 1회성 이메일 알림 스캔 (매시 :50, 07-22 KST) → backend /api/alerts/scan.
  - cronjob-alert-scan.yaml

# 데모 뉴스룸 정적 콘텐츠(index.html + nginx default.conf) → ConfigMap.
# 내용 변경 시 hash 접미사가 바뀌어 Deployment 가 자동 롤링된다.
configMapGenerator:
  - name: demo-newsroom
    files:
      - configs/demo-newsroom/index.html
      - configs/demo-newsroom/default.conf
