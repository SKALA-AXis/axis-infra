# 작성일: 2026-05-04
# 작성자: 최종민
# 변경이력:
#   2026-05-04 최종민 — namespace ResourceQuota/LimitRange 최초 작성(kustomize base) 및 단일 namespace 적용
# namespace 안의 리소스 한도 + 기본 limit/request.
#
# Namespace 자체 (`kind: Namespace`) 는 SKALA 클러스터에서 미리 생성됨
# (skala3-finalproj-class3-team13) — 우리가 재생성하면 권한 에러.
# 자체 EKS 띄울 때만 별도 overlay 에서 Namespace 리소스 추가.
#
# ResourceQuota / LimitRange 도 SKALA 환경에서 권한 거부될 수 있음 —
# kubectl apply 실패 시 base resources 에서 namespace.yaml 자체를 제외하거나
# overlay 별 분리 필요.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: axis-quota
  namespace: skala3-finalproj-class3-team13
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "30"
    persistentvolumeclaims: "5"
    services: "10"
---
# 명시적 resources 가 없는 Pod 가 들어왔을 때의 fallback.
apiVersion: v1
kind: LimitRange
metadata:
  name: axis-defaults
  namespace: skala3-finalproj-class3-team13
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
