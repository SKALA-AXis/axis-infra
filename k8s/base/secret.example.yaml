# axis-secrets — 자격증명 템플릿.
#
# 사용법:
#   1) 이 파일을 secret.yaml 로 복사 (`cp secret.example.yaml secret.yaml`).
#   2) 모든 REPLACE_* 값을 실제 자격증명으로 채움.
#   3) `kubectl apply -f secret.yaml` 또는 kustomize 로 적용.
#
# secret.yaml 파일은 절대 커밋 금지 (.gitignore 에 등록).
#
# 운영 단계 (D14=c) 에서는 External Secrets Operator + AWS SSM 으로 대체될 예정.
# 그 시점엔 secret.yaml 자체가 사라지고 ExternalSecret 리소스로 변환됨.
apiVersion: v1
kind: Secret
metadata:
  name: axis-secrets
  namespace: skala3-finalproj-class3-team13
type: Opaque
stringData:
  # ── DB (Supabase pooler 권장: 6543 + sslmode=require + prepareThreshold=0)
  SPRING_DATASOURCE_URL: "REPLACE_JDBC_URL"
  SPRING_DATASOURCE_USERNAME: "REPLACE_DB_USERNAME"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_DB_PASSWORD"
  DATABASE_URL: "REPLACE_PYTHON_DSN"

  # ── Vector DB
  QDRANT_API_KEY: "REPLACE_QDRANT_API_KEY"

  # ── LLM
  OPENAI_API_KEY: "REPLACE_OPENAI_API_KEY"

  # ── 외부 수집 API
  NAVER_CLIENT_ID: "REPLACE_NAVER_CLIENT_ID"
  NAVER_CLIENT_SECRET: "REPLACE_NAVER_CLIENT_SECRET"
  NAVER_CLIENT_IDS: "REPLACE_NAVER_CLIENT_ID_1,REPLACE_NAVER_CLIENT_ID_2"
  NAVER_CLIENT_SECRETS: "REPLACE_NAVER_CLIENT_SECRET_1,REPLACE_NAVER_CLIENT_SECRET_2"
  DART_API_KEY: "REPLACE_DART_API_KEY"
  KIPRIS_API_KEY: "REPLACE_KIPRIS_API_KEY"
  WORK24_API_KEY: "REPLACE_WORK24_API_KEY"
  WORK24_RETURN_TYPE: "XML"

  # ── SMTP (axis-ai pod 만 사용 — D8b=a)
  SMTP_USER: "REPLACE_SMTP_USER"
  SMTP_PASSWORD: "REPLACE_SMTP_PASSWORD"

  # ── backend 인증
  JWT_SECRET: "REPLACE_JWT_SECRET_32_BYTES_OR_MORE"

  # ── CronJob → backend 내부 통신 토큰 (B7 검증, D7=a)
  CRON_INTERNAL_TOKEN: "REPLACE_CRON_TOKEN_RANDOM_HEX_64"
