# 작성자: 최종민
# 변경이력:
#   2026-05-04 최종민 — kustomize base(EKS) 매니페스트에 axis-ai Service 추가
#   2026-05-06 최종민 — SKALA 공유 클러스터 단일 namespace 적용
# axis-ai Service.
#   · ClusterIP — 외부 노출 절대 금지.
#   · NetworkPolicy 가 backend pod 만 접근 허용 (networkpolicy.yaml 참조).
apiVersion: v1
kind: Service
metadata:
  name: axis-ai
  namespace: skala3-finalproj-class3-team13
  labels:
    app: axis-ai
    tier: business
spec:
  type: ClusterIP
  selector:
    app: axis-ai
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
