# 작성자: 박지원
# 변경이력:
#   2026-05-12 박지원 — Track C ingestion CronJob track 설정 작성·수정
#   2026-06-05 최종민 — CronJob 실패 Slack 알림 적용, 이후 콜드스타트 흡수 보강
# Track C · 업무시간성 채용/기업 뉴스 인제스션.
#   · jobs / company_news
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-ingestion-c
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  schedule: "30 8,17 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # curl --max-time 60 self-bound → 재시도 포함 ~4분. 멈춤 backstop 5분 통일.
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: ingestion-c
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-cron-sa
          containers:
            - name: trigger
              image: curlimages/curl:8.5.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  # 일시적 backend 연결거부 흡수 (--retry-connrefused). 정상은 즉시 202.
                  curl -fsSL \
                    --connect-timeout 5 --max-time 60 \
                    --retry 3 --retry-delay 5 --retry-connrefused \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${CRON_INTERNAL_TOKEN}" \
                    "http://axis-backend:8080/api/pipeline/trigger?track=C"
              env:
                # optional: true — 키 누락 시에도 파드 기동 (CreateContainerConfigError 회피).
                - name: CRON_INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: axis-secrets
                      key: CRON_INTERNAL_TOKEN
                      optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
