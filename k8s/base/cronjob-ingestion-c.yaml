# Track C · 저빈도/무거운 문서형 수집.
#   · DART / IR / 산업 리포트 / SK AX 사이트 등 비교적 무거운 작업.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-ingestion-c
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  schedule: "30 3 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 5400
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: ingestion-c
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-cron-sa
          containers:
            - name: trigger
              image: curlimages/curl:8.5.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  curl -fsSL --max-time 60 \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${CRON_INTERNAL_TOKEN}" \
                    "http://axis-backend:8080/api/pipeline/trigger?track=C"
              env:
                - name: CRON_INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: axis-secrets
                      key: CRON_INTERNAL_TOKEN
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
