# Track A · 뉴스성 고빈도 인제스션.
#   · naver_news / global_newsroom
#   · backend 의 /api/pipeline/trigger?track=A 호출 (B1 코드 변경 후 동작).
#   · concurrencyPolicy: Forbid — 직전 Job 안 끝났으면 새 Job 미생성.
#   · 인증: CRON_INTERNAL_TOKEN (B7 + D7=a) — backend 가 Authorization 헤더 검증.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-ingestion-a
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  schedule: "10 7-22 * * *"  # 노드 야간 셧다운(23:00-07:00 KST) 회피 — docs/adr/0007 참조
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # curl --max-time 60 이 각 시도를 60s 로 제한 → 재시도(backoff 2) 포함 ~4분이면 충분.
      # 멈춤(stuck) backstop 으로 5분 통일 (트리거는 backend 파이프라인을 async 로 띄움).
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: ingestion-a
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-cron-sa
          containers:
            - name: trigger
              image: curlimages/curl:8.5.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  # 일시적 backend 연결거부 흡수 (--retry-connrefused). 정상은 즉시 202.
                  curl -fsSL \
                    --connect-timeout 5 --max-time 60 \
                    --retry 3 --retry-delay 5 --retry-connrefused \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${CRON_INTERNAL_TOKEN}" \
                    "http://axis-backend:8080/api/pipeline/trigger?track=A"
              env:
                # optional: true — 키 누락 시에도 파드 기동 (CreateContainerConfigError 회피).
                - name: CRON_INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: axis-secrets
                      key: CRON_INTERNAL_TOKEN
                      optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
