# 워크로드 실패 감시 → Slack 알림 (CronJob/Job 실패 + 상시 Pod 크래시).
#
# 문제: ① CronJob(ingestion-*, delivery, global-trend, card-evaluator, pg-dump 등)이
#       실패하거나, ② 상시 Deployment(backend/ai/frontend) 파드가 CrashLoopBackOff /
#       OOMKilled / ImagePullBackOff 로 죽어도 kubectl/ArgoCD 를 직접 보기 전까진
#       아무도 모른다. 공용(매니저 운영) ArgoCD 라 argocd-notifications 로 앱 "Degraded"
#       알림을 거는 건 팀 권한 밖 → Degraded 를 유발하는 실제 원인(파드 비정상)을
#       namespace 레벨에서 직접 잡아 동등하게 커버한다.
# 해결: 10분마다 namespace 의 Job + Pod 를 API 로 조회해
#       · Job: condition Failed=True
#       · Pod: container 가 CrashLoopBackOff/ImagePullBackOff/ErrImagePull/
#              CreateContainerConfigError/OOMKilled 이거나 restartCount>=5
#       인 것 중 아직 안 알린 것만 Slack Webhook 으로 보낸다. 한 번 알린 대상은
#       annotation(axis.skala/slack-alerted)으로 표시해 재알림하지 않는다.
#
# 컨테이너 안 wrapper 가 아니라 상태를 API 로 읽는 watcher 방식이라
# DeadlineExceeded / OOMKilled / ImagePullBackOff / backoff 소진 등 컨테이너가
# 코드를 실행하기도 전에 죽는 실패까지 모두 잡는다.
# Job 이 소유한 파드는 Job 패스가 담당하므로 Pod 패스에서 제외(중복 알림 방지).
#
# SLACK_WEBHOOK_URL(axis-secrets)이 비어 있으면 알림을 건너뛰고 정상 종료한다.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: axis-cron-notifier
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "patch"]
  # 상시 워크로드(Deployment 등) 파드 크래시 감시용 — 조회 + 알림표시 annotation patch.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: axis-cron-notifier
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
subjects:
  - kind: ServiceAccount
    name: axis-cron-notifier-sa
    namespace: skala3-finalproj-class3-team13
roleRef:
  kind: Role
  name: axis-cron-notifier
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-failure-notifier
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  # 10분 주기. 실패 Job 은 ttlSecondsAfterFinished(1h) 동안 살아있어 그 안에 한 번은 잡힌다.
  schedule: "*/10 * * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # 장애 시 Job/Pod 다수 조회·annotation patch — 120s 는 API 지연 시 DeadlineExceeded.
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: failure-notifier
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-cron-notifier-sa
          containers:
            - name: notifier
              # kubectl + jq + curl 번들 (Job 상태 조회 + JSON 파싱 + Slack post).
              image: alpine/k8s:1.30.2
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: axis-secrets
                      key: SLACK_WEBHOOK_URL
                      optional: true   # 미설정이면 빈값 → 스크립트가 graceful skip
                - name: HOME
                  value: /tmp
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  : "${NAMESPACE:?}"
                  if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
                    echo "[notifier] SLACK_WEBHOOK_URL 미설정 — 알림 건너뜀 (정상 종료)"
                    exit 0
                  fi
                  CACHE=--cache-dir=/tmp/.kube/cache

                  # condition Failed=True 이고 아직 안 알린(annotation 없음) Job 만 추출.
                  # diag-* 수동 디버그 Job · axis.skala/diagnostic 라벨 Job 은 ArgoCD/Slack 노이즈 제외.
                  kubectl get jobs -n "$NAMESPACE" $CACHE -o json \
                    | jq -c '.items[]
                        | select((.status.conditions // []) | any(.type=="Failed" and .status=="True"))
                        | select((.metadata.annotations // {})["axis.skala/slack-alerted"] != "true")
                        | select((.metadata.labels // {})["axis.skala/diagnostic"] != "true")
                        | select((.metadata.name | startswith("diag-")) | not)' \
                    > /tmp/failed.jsonl

                  count=0
                  while IFS= read -r job; do
                    [ -n "$job" ] || continue
                    name=$(printf '%s' "$job"   | jq -r '.metadata.name')
                    cron=$(printf '%s' "$job"   | jq -r '(.metadata.ownerReferences // [])[0].name // .metadata.labels.cron // "standalone"')
                    reason=$(printf '%s' "$job" | jq -r '[(.status.conditions // [])[] | select(.type=="Failed") | .reason] | first // "Failed"')
                    msg=$(printf '%s' "$job"    | jq -r '[(.status.conditions // [])[] | select(.type=="Failed") | .message] | first // ""')
                    failed=$(printf '%s' "$job" | jq -r '.status.failed // 0')

                    text=":rotating_light: *CronJob 실패* — \`$cron\`
                  • job: \`$name\`
                  • namespace: \`$NAMESPACE\`
                  • reason: *$reason*  (failed pods: $failed)
                  • message: $msg
                  • 확인: kubectl -n $NAMESPACE describe job $name / logs job/$name"
                    payload=$(jq -n --arg t "$text" '{text:$t}')

                    if curl -fsS --max-time 15 -X POST -H 'Content-Type: application/json' \
                         --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null; then
                      # 성공해야만 alerted 마킹 — Slack 실패 시 다음 주기 재시도.
                      kubectl annotate job -n "$NAMESPACE" "$name" $CACHE \
                        axis.skala/slack-alerted=true --overwrite >/dev/null
                      count=$((count + 1))
                      echo "[notifier] alerted: $name (cron=$cron reason=$reason)"
                    else
                      echo "[notifier] Slack post 실패: $name — 다음 주기 재시도"
                    fi
                  done < /tmp/failed.jsonl
                  job_count=$count

                  # ── Pass 2: 상시 Pod 크래시 (Deployment/StatefulSet 등) ──────
                  # Job 소유 파드는 위 Job 패스가 담당 → 제외. notifier 자기 자신도 제외.
                  # container 가 CrashLoopBackOff/ImagePullBackOff/ErrImagePull/
                  # CreateContainerConfigError/OOMKilled 이거나 restartCount>=5 면 비정상.
                  kubectl get pods -n "$NAMESPACE" $CACHE -o json \
                    | jq -c '.items[]
                        | select((.metadata.ownerReferences // []) | map(.kind) | index("Job") | not)
                        | select((.metadata.labels.cron // "") != "failure-notifier")
                        | select((.metadata.annotations // {})["axis.skala/slack-alerted"] != "true")
                        | . as $p
                        | [ ($p.status.containerStatuses // [])[]
                            | {
                                name,
                                restartCount,
                                reason: (
                                  (.state.waiting.reason // "") as $w
                                  | (.lastState.terminated.reason // "") as $lt
                                  | (.state.terminated.reason // "") as $t
                                  | if (["CrashLoopBackOff","ImagePullBackOff","ErrImagePull","CreateContainerConfigError","CreateContainerError","InvalidImageName"] | index($w)) then $w
                                    elif ($lt == "OOMKilled" or $t == "OOMKilled") then "OOMKilled"
                                    elif (.restartCount >= 5) then "RestartLoop"
                                    else "" end)
                              }
                            | select(.reason != "")
                          ] as $bad
                        | select(($bad | length) > 0)
                        | { name: $p.metadata.name,
                            node: ($p.spec.nodeName // "?"),
                            owner: ((.metadata.ownerReferences // [])[0].name // "standalone"),
                            bad: $bad }' \
                    > /tmp/badpods.jsonl

                  while IFS= read -r pod; do
                    [ -n "$pod" ] || continue
                    name=$(printf '%s' "$pod"  | jq -r '.name')
                    node=$(printf '%s' "$pod"  | jq -r '.node')
                    owner=$(printf '%s' "$pod" | jq -r '.owner')
                    detail=$(printf '%s' "$pod" | jq -r '[.bad[] | "\(.name)=\(.reason)(restarts \(.restartCount))"] | join(", ")')

                    text=":fire: *Pod 비정상* — \`$owner\`
                  • pod: \`$name\`
                  • namespace: \`$NAMESPACE\`  (node: \`$node\`)
                  • containers: $detail
                  • 확인: kubectl -n $NAMESPACE describe pod $name / logs $name --previous"
                    payload=$(jq -n --arg t "$text" '{text:$t}')

                    if curl -fsS --max-time 15 -X POST -H 'Content-Type: application/json' \
                         --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null; then
                      # 성공해야만 alerted 마킹 — Slack 실패 시 다음 주기 재시도.
                      kubectl annotate pod -n "$NAMESPACE" "$name" $CACHE \
                        axis.skala/slack-alerted=true --overwrite >/dev/null
                      count=$((count + 1))
                      echo "[notifier] alerted pod: $name (owner=$owner)"
                    else
                      echo "[notifier] Slack post 실패(pod): $name — 다음 주기 재시도"
                    fi
                  done < /tmp/badpods.jsonl

                  echo "[notifier] done — 신규 알림 $count 건 (job=$job_count pod=$((count - job_count)))"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                # kubectl discovery 캐시 / jq 임시파일을 /tmp 에 써야 하므로 rootfs 쓰기 허용.
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 65534
