# langfuse-secret — Langfuse self-host 자격증명 템플릿.
#
# 사용법:
#   1) 이 파일을 langfuse-secret.yaml 로 복사 (`cp langfuse-secret.example.yaml langfuse-secret.yaml`).
#   2) 모든 REPLACE_* 값을 실제 자격증명으로 채움 (생성 명령은 아래 노트).
#   3) `kubectl apply -f langfuse-secret.yaml` 로 적용.
#
# langfuse-secret.yaml 파일은 절대 커밋 금지 (.gitignore 에 등록).
#
# 운영 단계에서는 External Secrets Operator + AWS SSM 으로 대체.
#
# 값 생성 명령:
#   NEXTAUTH_SECRET / SALT (각 32 bytes hex):
#     openssl rand -hex 32
#   POSTGRES_PASSWORD (alphanumeric 24+):
#     openssl rand -base64 24 | tr -d '/+='
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secret
  namespace: skala3-finalproj-class3-team13
  annotations:
    # ArgoCD 가 secret 의 stringData 변경을 OutOfSync 로 판정하지 않도록.
    # langfuse-application.yaml 의 ignoreDifferences 와 짝.
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  # ── NextAuth (session token 서명 + 암호화)
  NEXTAUTH_SECRET: "REPLACE_NEXTAUTH_SECRET_32_BYTES_HEX"

  # ── Salt (DB 안의 sensitive value salt)
  SALT: "REPLACE_SALT_32_BYTES_HEX"

  # ── 내장 PostgreSQL admin / user 패스워드 (chart 가 둘 다 동일 key 참조)
  POSTGRES_PASSWORD: "REPLACE_POSTGRES_PASSWORD_24_CHARS"

  # ── (선택) 초기 admin 자동 가입 — 비워두면 첫 접속자가 가입
  # LANGFUSE_INIT_USER_EMAIL: "admin@team13.skala-ai.com"
  # LANGFUSE_INIT_USER_NAME: "Team13 Admin"
  # LANGFUSE_INIT_USER_PASSWORD: "REPLACE_INIT_ADMIN_PASSWORD"
  # LANGFUSE_INIT_ORG_NAME: "AXIS-team13"
  # LANGFUSE_INIT_PROJECT_NAME: "axis-ai"
  # LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-..."     # 선택: 미리 발급한 key 사용
  # LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-..."
