# Track D · 문서/리포트/자사 사이트 저빈도 인제스션.
#   · DART / IR / Naver DataLab / SPRi / BCG.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-ingestion-d
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  # 07:15 KST — 노드 야간 셧다운(23:00-07:00 KST) 회피.
  # Naver DataLab 최신 일자 보강은 axis-cron-naver-datalab-late 가 별도 수행한다.
  schedule: "15 7 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: ingestion-d
        spec:
          restartPolicy: Never
          serviceAccountName: axis-cron-sa
          containers:
            - name: trigger
              image: curlimages/curl:8.5.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  # 일시적 backend 재기동/연결거부를 흡수 (--retry-connrefused).
                  # backend 는 즉시 202 반환(async)이라 정상 호출은 <1s.
                  curl -fsSL \
                    --connect-timeout 5 --max-time 60 \
                    --retry 3 --retry-delay 5 --retry-connrefused \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${CRON_INTERNAL_TOKEN}" \
                    "http://axis-backend:8080/api/pipeline/trigger?track=D"
              env:
                # optional: true — 키가 시크릿에서 누락돼도 파드는 기동한다.
                # (non-optional 이면 CreateContainerConfigError 로 파드가 아예 못 떠
                #  매 run 실패 → ArgoCD Degraded. 이 레포가 반복적으로 겪은 함정 —
                #  cronjob-sector-pulse.yaml 주석 참고.) 키가 비면 backend 가 자체 토큰도
                #  비어 있을 때 통과시키거나, 토큰 설정 시 명확한 401 을 반환해 진단이 쉽다.
                - name: CRON_INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: axis-secrets
                      key: CRON_INTERNAL_TOKEN
                      optional: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
