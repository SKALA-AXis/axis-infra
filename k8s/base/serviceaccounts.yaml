# 워크로드별 ServiceAccount 분리.
# 운영 (D14=c) 시 IRSA annotation 추가:
#   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT>:role/axis-{service}-irsa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axis-frontend-sa
  namespace: axis
  labels:
    app: axis-frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axis-backend-sa
  namespace: axis
  labels:
    app: axis-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axis-ai-sa
  namespace: axis
  labels:
    app: axis-ai
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axis-cron-sa
  namespace: axis
  labels:
    app.kubernetes.io/component: cron
