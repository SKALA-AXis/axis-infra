# W4-3 · 월 1회 (1일 03:00 KST) peer capability_evolution narrative 갱신.
#   · raw_article_business_signals 4분기 분 → SQL pre-aggregation (top-5/group) → LLM 합성.
#   · 결과: peer_companies.peer_plus_payload['capability_evolution'] JSONB.
#   · 비용: 5 peer × $0.15 ≈ $0.75/월.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-capability-evolution
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  # scripts/refresh_capability_evolution.py 구현됨 — 검증 전까지 suspend 유지.
  # profile-refresh(분기)가 profile_snapshot.capability_evolution 을 이미 채움.
  # unsuspend 전: axis-ai 이미지에 스크립트 포함 확인 + 수동 Job 1회 성공 검증.
  suspend: true
  # 월 1회 (1일 03:00 KST). peer 5 사 × LLM 1 회 ≈ $0.75/월.
  schedule: "0 3 1 * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 5400  # 90 분
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: capability-evolution
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-ai-sa
          containers:
            - name: refresh
              image: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-ai:REPLACE_TAG
              command: ["python", "scripts/refresh_capability_evolution.py"]
              envFrom:
                - configMapRef:
                    name: axis-config
                - secretRef:
                    name: axis-secrets
              env:
                - name: PYTHONPATH
                  value: /app
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 1500m
                  memory: 3Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
