# Peer profile refresh after DART/IR ingestion.
#   · Track D가 DART/IR 문서를 적재한 뒤 최근 26시간 내 변경 회사만 갱신.
#   · 분기 1회 전체 갱신(axis-cron-profile-refresh)은 그대로 유지한다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-profile-refresh-recent
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  schedule: "0 8 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: profile-refresh-recent
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-ai-sa
          containers:
            - name: refresh
              image: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-ai:REPLACE_TAG
              command:
                - python
                - scripts/refresh_peer_profile_snapshots.py
                - --changed-since-hours
                - "26"
              env:
                - name: PYTHONPATH
                  value: /app
              envFrom:
                - configMapRef:
                    name: axis-config
                - secretRef:
                    name: axis-secrets
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 1500m
                  memory: 3Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
