# W2-2 · 주 1회 (월 03:00 KST) peer profile_snapshot 갱신.
#   · axis-ai 컨테이너에서 scripts/refresh_peer_profile_snapshots.py 실행.
#   · ProfileAgent.build_profile 합성 → peer_companies.profile_snapshot JSONB 저장.
#   · 비용: 5 peer × ~$0.15 ≈ $0.75/주.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-profile-refresh
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  suspend: true  # LLM cron 임시 비활성화: Track A relevance 외 LLM 호출 차단
  schedule: "0 3 * * 1"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 5400  # 90 분
      ttlSecondsAfterFinished: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: profile-refresh
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-ai-sa
          containers:
            - name: refresh
              image: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-ai:REPLACE_TAG
              command: ["python", "scripts/refresh_peer_profile_snapshots.py"]
              envFrom:
                - configMapRef:
                    name: axis-config
                - secretRef:
                    name: axis-secrets
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 1500m
                  memory: 3Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
