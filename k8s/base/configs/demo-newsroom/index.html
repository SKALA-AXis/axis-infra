<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXIS 데모 뉴스룸 — 중요 이슈 게시</title>
  <style>
    :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; --danger:#b91c1c; --ok:#047857; --skip:#92400e; }
    * { box-sizing: border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',sans-serif;
           color:var(--ink); max-width:760px; margin:0 auto; padding:28px 20px 60px; background:#f9fafb; }
    header { border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:24px; }
    h1 { font-size:22px; margin:0; }
    .sub { color:var(--muted); font-size:14px; margin-top:8px; line-height:1.6; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:22px; margin-bottom:22px; }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
           font-size:14px; font-family:inherit; background:#fff; }
    textarea { min-height:64px; resize:vertical; }
    .hint { font-size:12px; color:var(--muted); margin-top:4px; }
    button { margin-top:20px; width:100%; padding:13px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .result { margin-top:18px; padding:14px 16px; border-radius:8px; font-size:14px; line-height:1.5; display:none; }
    .result.show { display:block; }
    .result.ok { background:#ecfdf5; color:var(--ok); border:1px solid #a7f3d0; }
    .result.skip { background:#fffbeb; color:var(--skip); border:1px solid #fde68a; }
    .result.fail { background:#fef2f2; color:var(--danger); border:1px solid #fecaca; }
    .result.pending { background:#eff6ff; color:var(--accent); border:1px solid #bfdbfe; }
    h2 { font-size:15px; margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; }
    .refresh { width:auto; margin:0; padding:6px 12px; font-size:12px; background:#f3f4f6; color:var(--ink); border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    .muted { color:var(--muted); }
    .tokrow { display:flex; gap:10px; align-items:flex-end; }
    .tokrow > div { flex:1; }
    .badge { display:inline-block; background:var(--danger); color:#fff; font-size:11px; font-weight:600;
           padding:3px 9px; border-radius:4px; }
  </style>
</head>
<body>
  <header>
    <span class="badge">🚨 AXIS ALERT DEMO</span>
    <h1 style="margin-top:10px;">데모 뉴스룸 — 중요 이슈 게시</h1>
    <p class="sub">
      여기에 뉴스를 게시하면 AXIS 가 평가합니다. <b>누가 봐도 큰 이벤트(수주·파트너십·M&amp;A)</b>로
      판정될 때만 <b>이메일 알림이 1회</b> 발송됩니다. 인사·기술 발표 등은 게이트에서 걸러져 알림이 가지 않습니다(정밀도 보장).
    </p>
  </header>

  <div class="card">
    <form id="publishForm" autocomplete="off">
      <label for="peerId">대상 회사</label>
      <select id="peerId">
        <option value="samsung_sds">삼성SDS</option>
        <option value="lg_cns">LG CNS</option>
        <option value="hyundai_autoever">현대오토에버</option>
        <option value="posco_dx">포스코DX</option>
      </select>

      <label for="eventType">이벤트 유형</label>
      <select id="eventType">
        <option value="contract">수주·계약 (알림 대상)</option>
        <option value="ma">M&amp;A·인수 (알림 대상)</option>
        <option value="partnership">파트너십·제휴 (알림 대상)</option>
        <option value="personnel">인사·조직 (비대상 — 알림 안 감)</option>
        <option value="tech_release">기술 발표 (비대상 — 알림 안 감)</option>
      </select>

      <label for="title">제목 *</label>
      <input id="title" type="text" placeholder="예: 삼성SDS, 1조원 규모 차세대 시스템 구축 사업 수주" required />

      <label for="summary">요약</label>
      <textarea id="summary" placeholder="핵심 내용 한두 줄"></textarea>

      <label for="amount">계약/거래 금액 (선택)</label>
      <input id="amount" type="text" placeholder="예: 1조 2,000억원 — 입력 시 '금액 근거'로 게이트 통과" />
      <p class="hint">금액이 있으면 점수와 무관하게 '객관 근거 있음'으로 게이트를 통과합니다.</p>

      <div class="tokrow">
        <div>
          <label for="token">CRON 토큰</label>
          <input id="token" type="password" placeholder="CRON_INTERNAL_TOKEN (1회 입력 후 저장됨)" />
        </div>
      </div>
      <p class="hint">backend 인증용. 브라우저에만 저장되며 페이지에 노출되지 않습니다.</p>

      <button type="submit" id="submitBtn">게시 → 알림 평가</button>
    </form>
    <div id="result" class="result"></div>
  </div>

  <div class="card">
    <h2>발송된 알림 이력 <button type="button" class="refresh" id="refreshBtn">새로고침</button></h2>
    <table>
      <thead><tr><th>유형</th><th>제목</th><th>대상</th><th>경로</th><th>발송시각</th></tr></thead>
      <tbody id="history"><tr><td colspan="5" class="muted">토큰 입력 후 새로고침하세요.</td></tr></tbody>
    </table>
  </div>

  <script>
    var TOKEN_KEY = 'axis_demo_token';
    function $(s){ return document.querySelector(s); }
    function token(){ return $('#token').value.trim(); }
    function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    function setResult(msg, cls){ var el=$('#result'); el.textContent=msg; el.className='result show '+cls; }

    function renderOutcome(outcome){
      var map = {
        SENT: ['📧 중요 신호로 판정 → 이메일 알림 발송 완료!', 'ok'],
        SKIPPED_GATE: ['게이트 미통과 — 대형 이벤트(수주·파트너십·M&A) 기준 미달이라 알림 없음. (정밀도 보장)', 'skip'],
        SKIPPED_DUPLICATE: ['이미 같은 사건으로 발송됨 — 중복 알림 차단(1회만).', 'skip'],
        SKIPPED_NO_RECIPIENTS: ['수신자 미설정(BRIEFING_RECIPIENTS).', 'fail'],
        SKIPPED_DISABLED: ['알림 비활성 상태(AXIS_ALERT_ENABLED=false).', 'skip'],
        FAILED: ['발송 실패 — 서버 로그를 확인하세요.', 'fail']
      };
      var hit = map[outcome] || [outcome, 'skip'];
      setResult(hit[0], hit[1]);
    }

    async function loadHistory(){
      if(!token()) return;
      try {
        var res = await fetch('/api/demo/sent-alerts', { headers: { 'Authorization': 'Bearer ' + token() } });
        if(!res.ok) return;
        var json = await res.json();
        var rows = (json && json.data) || [];
        var tbody = $('#history');
        if(!rows.length){ tbody.innerHTML = '<tr><td colspan="5" class="muted">아직 발송된 알림이 없습니다.</td></tr>'; return; }
        tbody.innerHTML = rows.map(function(r){
          var at = (r.sentAt||'').replace('T',' ').slice(0,19);
          return '<tr><td>'+esc(r.eventType)+'</td><td>'+esc(r.title)+'</td><td>'+esc(r.peerId)+
                 '</td><td>'+esc(r.triggerSource)+'</td><td>'+esc(at)+'</td></tr>';
        }).join('');
      } catch(e){ /* noop */ }
    }

    $('#publishForm').addEventListener('submit', async function(e){
      e.preventDefault();
      localStorage.setItem(TOKEN_KEY, token());
      var btn = $('#submitBtn'); btn.disabled = true;
      setResult('평가 중…', 'pending');
      var body = {
        peerId: $('#peerId').value,
        eventType: $('#eventType').value,
        title: $('#title').value.trim(),
        summary: $('#summary').value.trim(),
        amount: $('#amount').value.trim()
      };
      try {
        var res = await fetch('/api/demo/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() },
          body: JSON.stringify(body)
        });
        if(res.status === 401){ setResult('인증 실패 — CRON 토큰을 확인하세요.', 'fail'); return; }
        var json = await res.json();
        var outcome = (json && json.data && json.data.outcome) || 'UNKNOWN';
        renderOutcome(outcome);
        loadHistory();
      } catch(err){
        setResult('요청 실패: ' + err.message, 'fail');
      } finally {
        btn.disabled = false;
      }
    });

    $('#refreshBtn').addEventListener('click', loadHistory);
    window.addEventListener('DOMContentLoaded', function(){
      var saved = localStorage.getItem(TOKEN_KEY);
      if(saved) $('#token').value = saved;
      loadHistory();
    });
  </script>
</body>
</html>
