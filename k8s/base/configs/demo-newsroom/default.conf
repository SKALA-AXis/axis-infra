# 데모 뉴스룸 — 단일 HTML 정적 서빙(비루트 nginx, listen 8080).
# API 호출(/api/demo/**)은 이 페이지의 same-origin fetch 로 ALB→backend 로 라우팅되므로
# 여기서 프록시하지 않는다(토큰은 페이지 UI 에서 입력 → backend CronInternalAuth 검증).
server {
    listen 8080;
    server_name _;
    charset utf-8;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # /demo-newsroom* 는 전부 단일 페이지로(클라이언트 사이드 동작).
    location /demo-newsroom {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
