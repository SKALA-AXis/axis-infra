# Delivery · 평일 08:30 메일 브리핑.
#   · backend 의 /api/pipeline/delivery 호출 → backend 가 ai 의 /pipeline/delivery 위임 (D8b=a).
#   · backend 측 endpoint 구현 필요 (B8).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-delivery
  namespace: axis
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  schedule: "30 8 * * 1-5"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: delivery
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-cron-sa
          containers:
            - name: trigger
              image: curlimages/curl:8.5.0
              command:
                - sh
                - -c
                - |
                  set -eu
                  curl -fsSL --max-time 60 \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -H "Authorization: Bearer ${CRON_INTERNAL_TOKEN}" \
                    "http://axis-backend:8080/api/pipeline/delivery"
              env:
                - name: CRON_INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: axis-secrets
                      key: CRON_INTERNAL_TOKEN
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
