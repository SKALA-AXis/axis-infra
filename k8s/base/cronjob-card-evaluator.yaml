# 작성일: 2026-05-21
# 작성자: 최종민
# 변경이력:
#   2026-05-21 최종민 — 카드 평가 등 supervisor 지원 CronJob 4종 신규 추가, 이후 activeDeadlineSeconds 420 설정·야간 셧다운 창 밖으로 스케줄 이동
#   2026-05-26 박지원 — track A 외 LLM CronJob suspend 처리, 이후 카드 평가 실행 빈도 축소·일 2회로 조정
# W5-2 · 일 2회 CardEvaluatorSidecar (LLM-as-Judge 4 score).
#   · card_news.evaluation_payload['llm_judge'] 가 비어있는 v2 카드를 평가.
#   · daily cost cap: $1/일 (EVAL_DAILY_BUDGET_USD env).
#   · batch limit: 10 (EVAL_BATCH_LIMIT env).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-card-evaluator
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  # 매일 12:00/22:00 v2 카드 LLM-as-Judge 평가. daily cap $1 (EVAL_DAILY_BUDGET_USD).
  suspend: false
  schedule: "0 12,22 * * *"  # 노드 야간 셧다운(23:00-07:00 KST) 회피 — docs/adr/0007 참조
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # 7분 — 노드 cold pull(~2분) + LLM batch(최대 20카드×4 metric) 여유. 240s 는 ImagePullBackOff 시 DeadlineExceeded.
      activeDeadlineSeconds: 420
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: card-evaluator
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-ai-sa
          containers:
            - name: evaluator
              # axis-ai-cron: Playwright/torch 제외 (~수백 MB). Dockerfile.cron 참조.
              image: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-ai-cron:REPLACE_TAG
              command: ["python", "-m", "scripts.evaluate_recent_cards"]
              envFrom:
                - configMapRef:
                    name: axis-config
                - secretRef:
                    name: axis-secrets
              env:
                - name: PYTHONPATH
                  value: /app
                - name: EVAL_BATCH_LIMIT
                  value: "10"
                - name: EVAL_DAILY_BUDGET_USD
                  value: "1"
                - name: EVAL_LOOKBACK_HOURS
                  value: "24"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
