# W5-2 · 5분 주기 CardEvaluatorSidecar (LLM-as-Judge 4 score).
#   · card_news.evaluation_payload['llm_judge'] 가 비어있는 v2 카드를 평가.
#   · daily cost cap: $5/일 (EVAL_DAILY_BUDGET_USD env).
#   · batch limit: 20 (EVAL_BATCH_LIMIT env).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-card-evaluator
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  suspend: true  # LLM cron 임시 비활성화: Track A relevance 외 LLM 호출 차단
  schedule: "*/5 * * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240  # 4분 (다음 주기 5분 안에 정리)
      ttlSecondsAfterFinished: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: card-evaluator
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-ai-sa
          containers:
            - name: evaluator
              image: REPLACE_ACCOUNT.dkr.ecr.ap-northeast-2.amazonaws.com/axis-ai:REPLACE_TAG
              command: ["python", "-m", "scripts.evaluate_recent_cards"]
              envFrom:
                - configMapRef:
                    name: axis-config
                - secretRef:
                    name: axis-secrets
              env:
                - name: EVAL_BATCH_LIMIT
                  value: "20"
                - name: EVAL_DAILY_BUDGET_USD
                  value: "5"
                - name: EVAL_LOOKBACK_HOURS
                  value: "24"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 65534
