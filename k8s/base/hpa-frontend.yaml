# 변경이력:
#   2026-05-04 최종민 — frontend HPA 최초 작성(kustomize base) 및 단일 namespace 적용
# Horizontal Pod Autoscaler — frontend
# 전제: metrics-server 설치 (EKS 기본 미포함, helm install metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: axis-frontend
  namespace: skala3-finalproj-class3-team13
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: axis-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
