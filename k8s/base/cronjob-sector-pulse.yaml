# W4-4 · 주 1회 (월 02:00 KST) sector_pulse MATERIALIZED VIEW REFRESH.
#   · LLM 호출 0건.
#   · psql 컨테이너에서 단일 REFRESH 쿼리 실행.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: axis-cron-sector-pulse
  namespace: skala3-finalproj-class3-team13
  labels:
    app.kubernetes.io/component: cron
    app.kubernetes.io/part-of: axis
spec:
  schedule: "50 7 * * 1"  # 노드 야간 셧다운(23:00-07:00 KST) 회피 — docs/adr/0007 참조
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: cron
            cron: sector-pulse
        spec:
          restartPolicy: OnFailure
          serviceAccountName: axis-cron-sa
          containers:
            - name: refresh
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - |
                  set -eu
                  # postgres 일시 재기동/연결거부 흡수. 주 1회(월 02:00) 단발성이라
                  # 실패 시 다음 run 까지 7일 — ingestion-a 처럼 후속 성공이 마커를
                  # 덮어쓰지 못해 Degraded 가 오래 보였다.
                  max_attempts=5
                  delay=15
                  attempt=1
                  run_refresh() {
                    psql "${POSTGRES_URL}" -v ON_ERROR_STOP=1 -c "$1"
                  }
                  retry_refresh() {
                    local sql="$1"
                    attempt=1
                    while [ "$attempt" -le "$max_attempts" ]; do
                      if run_refresh "$sql"; then
                        return 0
                      fi
                      echo "psql attempt ${attempt}/${max_attempts} failed, retry in ${delay}s..." >&2
                      attempt=$((attempt + 1))
                      [ "$attempt" -le "$max_attempts" ] && sleep "$delay"
                    done
                    return 1
                  }
                  # CONCURRENTLY: readers non-blocking. unique index + populated MV 필요.
                  if retry_refresh "REFRESH MATERIALIZED VIEW CONCURRENTLY sector_pulse;"; then
                    echo "sector_pulse refreshed (CONCURRENTLY)"
                    exit 0
                  fi
                  # MV 미초기화·unique index 부재 등 — blocking REFRESH 로 자가복구.
                  echo "CONCURRENTLY refresh failed — falling back to blocking REFRESH" >&2
                  retry_refresh "REFRESH MATERIALIZED VIEW sector_pulse;"
                  echo "sector_pulse refreshed (blocking fallback)"
              env:
                # axis-secrets 에는 POSTGRES_URL 키가 없고 DATABASE_URL(libpq 포맷
                # postgresql://user:pass@host:5432/db)이 존재한다. 실재하는 DATABASE_URL
                # 키를 psql 접속 문자열로 사용한다.
                - name: POSTGRES_URL
                  valueFrom:
                    secretKeyRef:
                      name: axis-secrets
                      key: DATABASE_URL
                      # optional: true — 키 누락 시에도 파드 기동 (CreateContainerConfigError 회피).
                      optional: true
                # 커넥션 stall fail-fast (pg-dump 와 동일 패턴).
                - name: PGCONNECT_TIMEOUT
                  value: "10"
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
