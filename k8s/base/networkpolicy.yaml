# NetworkPolicy 매트릭스.
#   기본 default-deny ingress + 명시적 allow.
#   egress 는 모두 허용 (외부 SaaS 호출 필요: Supabase / Qdrant Cloud / OpenAI / DART / Naver / KIPRIS / Saramin / SMTP / S3).
#
# 전제:
#   · NetworkPolicy 지원 CNI 활성 (EKS 의 VPC CNI 의 NetworkPolicy 활성 또는 Calico/Cilium 설치).
#   · 기본 VPC CNI 는 NetworkPolicy 미지원 — 별도 설정 필수.
#
# 검증: 외부 pod 에서 `kubectl exec ... -- curl axis-ai:8001/health` 가 차단되어야 정상.
---
# 1) default-deny — axis 네임스페이스 모든 Pod 의 ingress 거부 (이후 룰로 명시 허용)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: skala3-finalproj-class3-team13
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2) frontend ← Ingress Controller (SKALA: public-nginx ns / legacy: kube-system ALB)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-from-ingress
  namespace: skala3-finalproj-class3-team13
spec:
  podSelector:
    matchLabels:
      app: axis-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: public-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 3000
---
# 3) backend ← Ingress + 같은 네임스페이스의 CronJob
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend
  namespace: skala3-finalproj-class3-team13
spec:
  podSelector:
    matchLabels:
      app: axis-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: public-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cron
      ports:
        - protocol: TCP
          port: 8080
---
# 4) ai ← backend + CronJob(global-trend 등 axis-ai 직접 호출)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ai-from-backend
  namespace: skala3-finalproj-class3-team13
spec:
  podSelector:
    matchLabels:
      app: axis-ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: axis-backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cron
      ports:
        - protocol: TCP
          port: 8001
---
# 5) demo-newsroom(시연 정적 페이지) ← Ingress Controller. frontend 와 동일 출처, port 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-demo-newsroom-from-ingress
  namespace: skala3-finalproj-class3-team13
spec:
  podSelector:
    matchLabels:
      app: demo-newsroom
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: public-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8080
