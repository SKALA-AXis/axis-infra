# (Legacy) 운영 배포용 docker-compose — 더 이상 사용 안 함.
# 운영은 SKALA EKS (`skala3-finalproj-class3-team13`) + 공용 ArgoCD GitOps.
# 본 파일은 비상 시 docker-compose 로 prod-like 환경을 재현해야 할 경우만 참조.
# 그 경우에도 외부 Supabase / Qdrant Cloud 를 가정하지 말고, postgres + qdrant 컨테이너를 같이 띄울 것.

services:
  backend:
    build:
      context: ../axis-backend
      dockerfile: Dockerfile
    container_name: axis-backend
    restart: always
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AI_SERVER_URL: http://ai:8001
      SPRING_PROFILES_ACTIVE: prod
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/data/images}
    ports:
      - "8080:8080"
    volumes:
      - axis-images:/data/images:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ../axis-ai
      dockerfile: Dockerfile
    container_name: axis-ai
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      DART_API_KEY: ${DART_API_KEY}
      KIPRIS_API_KEY: ${KIPRIS_API_KEY}
      SARAMIN_API_KEY: ${SARAMIN_API_KEY}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/data/images}
    expose:
      - "8001"
    volumes:
      - axis-images:/data/images
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../axis-frontend
      dockerfile: Dockerfile
    container_name: axis-frontend
    restart: always
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # 카드 뉴스 이미지 공유 볼륨 — ai(write) ↔ backend(read)
  axis-images:

networks:
  default:
    name: axis-network-prod
