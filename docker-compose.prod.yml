version: '3.8'

# 운영 배포용 — docker compose -f docker-compose.prod.yml up -d
# 반드시 .env에 실제 운영 값을 설정한 후 실행하세요.

services:
  postgres:
    image: postgres:16
    container_name: axis-postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 운영 환경에서는 포트 외부 노출 금지
    expose:
      - "5432"

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: axis-qdrant
    restart: always
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6333"
      - "6334"

  backend:
    build:
      context: ../axis-backend
      dockerfile: Dockerfile
    container_name: axis-backend
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_SERVER_URL: http://ai:8001
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ../axis-ai
      dockerfile: Dockerfile
    container_name: axis-ai
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      DART_API_KEY: ${DART_API_KEY}
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../axis-frontend
      dockerfile: Dockerfile
    container_name: axis-frontend
    restart: always
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_storage:

networks:
  default:
    name: axis-network-prod
