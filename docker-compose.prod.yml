# 작성일: 2026-04-21
# 작성자: 최종민
# 변경이력:
#   2026-04-21 최종민 — 운영 배포 compose 베이스라인 작성, obsolete version 키 제거, Supabase+Qdrant Cloud 전환, 카드뉴스 이미지 공유 볼륨, SARAMIN→WORK24 API 키 전파
#   2026-05-18 박지원 — naver id 수정
# 운영 배포용 — docker compose -f docker-compose.prod.yml up -d
# PostgreSQL = Supabase, Vector DB = Qdrant Cloud. 모든 자격증명은 .env에서 주입.
# 반드시 .env에 운영 값을 설정한 후 실행하세요.

services:
  backend:
    build:
      context: ../axis-backend
      dockerfile: Dockerfile
    container_name: axis-backend
    restart: always
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AI_SERVER_URL: http://ai:8001
      SPRING_PROFILES_ACTIVE: prod
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/data/images}
    ports:
      - "8080:8080"
    volumes:
      - axis-images:/data/images:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ../axis-ai
      dockerfile: Dockerfile
    container_name: axis-ai
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      NAVER_CLIENT_IDS: ${NAVER_CLIENT_IDS:-}
      NAVER_CLIENT_SECRETS: ${NAVER_CLIENT_SECRETS:-}
      DART_API_KEY: ${DART_API_KEY}
      KIPRIS_API_KEY: ${KIPRIS_API_KEY}
      WORK24_API_KEY: ${WORK24_API_KEY}
      WORK24_RETURN_TYPE: ${WORK24_RETURN_TYPE:-XML}
      IMAGE_STORAGE_PATH: ${IMAGE_STORAGE_PATH:-/data/images}
    expose:
      - "8001"
    volumes:
      - axis-images:/data/images
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../axis-frontend
      dockerfile: Dockerfile
    container_name: axis-frontend
    restart: always
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # 카드 뉴스 이미지 공유 볼륨 — ai(write) ↔ backend(read)
  axis-images:

networks:
  default:
    name: axis-network-prod
